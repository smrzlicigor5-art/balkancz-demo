    function Icon({ name, className = 'h-5 w-5' }) {
      const ref = useRef(null);
      useEffect(() => {
        if (ref.current && window.lucide?.icons?.[name]) {
          ref.current.innerHTML = '';
          ref.current.appendChild(window.lucide.createElement(window.lucide.icons[name], { class: className }));
        }
      }, [name, className]);
      return <span ref={ref} aria-hidden="true" />;
    }

    function Modal({ titleId, onClose, children }) {
      useEffect(() => {
        const onKeyDown = event => event.key === 'Escape' && onClose();
        document.addEventListener('keydown', onKeyDown);
        return () => document.removeEventListener('keydown', onKeyDown);
      }, [onClose]);
      return (
        <div className="fixed inset-0 z-50 flex items-end justify-center bg-slate-950/50 p-0 backdrop-blur-sm sm:items-center sm:p-4" onMouseDown={event => event.target === event.currentTarget && onClose()}>
          <div role="dialog" aria-modal="true" aria-labelledby={titleId} className="max-h-[94vh] w-full overflow-y-auto rounded-t-3xl bg-white shadow-2xl sm:max-w-2xl sm:rounded-3xl">{children}</div>
        </div>
      );
    }

    function App() {
      const [lang, setLang] = useState('exyu');
      const c = copy[lang];
      const [intakeOpen, setIntakeOpen] = useState(false);
      const [expanded, setExpanded] = useState(null);
      const [boardFilter, setBoardFilter] = useState('all');
      const [file, setFile] = useState(null);
      const [drag, setDrag] = useState(false);
      const [submission, setSubmission] = useState({ state: 'idle', message: '' });
      const [form, setForm] = useState({ name: '', email: '', phone: '', communication: 'exyu', problem: '', description: '', consent: false });
      const input = useRef(null);

      useEffect(() => {
        document.documentElement.lang = lang === 'ro' ? 'ro' : 'hr';
      }, [lang]);

      const currentCard = card => card[lang];
      const selectedProblemTitle = form.problem ? (problems.find(problem => problem.id === form.problem)?.[lang]?.title || form.problem) : '';
      const updateField = (field, value) => setForm(previous => ({ ...previous, [field]: value }));

      const openIntake = (problemId = '') => {
        updateField('problem', problemId);
        setSubmission({ state: 'idle', message: '' });
        setIntakeOpen(true);
      };

      const pick = candidateFiles => {
        const next = candidateFiles?.[0];
        if (!next) return;
        if (!ACCEPTED_TYPES.includes(next.type)) {
          setSubmission({ state: 'error', message: c.form.invalidFile });
          return;
        }
        if (next.size > MAX_FILE_SIZE) {
          setSubmission({ state: 'error', message: c.form.tooLarge });
          return;
        }
        setFile(next);
        setSubmission({ state: 'idle', message: '' });
      };

      const toDataUrl = selectedFile => new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(new Error(c.form.error));
        reader.readAsDataURL(selectedFile);
      });

      const submitDocument = async event => {
        event.preventDefault();
        if (!file) {
          setSubmission({ state: 'error', message: c.form.missingFile });
          return;
        }
        if (!form.email.trim() || !form.consent) {
          setSubmission({ state: 'error', message: c.form.missingBasics });
          return;
        }
        setSubmission({ state: 'loading', message: c.form.sending });
        try {
          const dataUrl = await toDataUrl(file);
          const response = await fetch('/api/submit', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              source: 'balkancz-vercel-demo',
              language: lang,
              communication_language: form.communication,
              submitted_at: new Date().toISOString(),
              client: { name: form.name.trim(), email: form.email.trim(), phone: form.phone.trim() },
              problem: selectedProblemTitle || (lang === 'ro' ? 'Evaluarea unui document oficial' : 'Procjena službenog dokumenta'),
              problem_id: form.problem || 'other',
              description: form.description.trim(),
              consent: form.consent,
              document: { filename: file.name, mime_type: file.type, size_bytes: file.size, data_url: dataUrl }
            })
          });
          const result = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(result.error || c.form.error);
          setSubmission({ state: 'success', message: c.form.success });
        } catch (error) {
          setSubmission({ state: 'error', message: lang === 'exyu' ? (error.message || c.form.error) : c.form.error });
        }
      };

      const filteredPosts = boardPosts.filter(post => boardFilter === 'all' || post.category === boardFilter);
      const toneClasses = {
        amber: 'bg-amber-50 text-amber-700 border-amber-200',
        rose: 'bg-rose-50 text-rose-700 border-rose-200',
        red: 'bg-red-50 text-red-700 border-red-200',
        blue: 'bg-trust-50 text-trust-700 border-trust-200',
        violet: 'bg-violet-50 text-violet-700 border-violet-200',
        emerald: 'bg-safe-50 text-safe-700 border-emerald-200'
      };

      return (
        <div className="min-h-screen bg-slate-50">
          <div className="bg-trust-900 px-4 py-2 text-center text-xs font-semibold text-white sm:text-sm">{c.topBar}</div>

          <header className="sticky top-0 z-30 border-b border-slate-200/80 bg-white/95 backdrop-blur">
            <div className="mx-auto flex min-h-16 max-w-7xl items-center justify-between gap-3 px-4 sm:px-6 lg:px-8">
              <a href="#top" className="flex min-w-0 items-center gap-2.5" aria-label={c.brand}>
                <div className="grid h-10 w-10 shrink-0 place-items-center rounded-2xl bg-trust-600 text-lg font-black text-white shadow-sm">A</div>
                <div className="min-w-0"><div className="truncate font-extrabold tracking-tight text-slate-950">{c.brand}</div><div className="truncate text-[10px] font-medium text-slate-500 sm:text-xs">{c.brandSub}</div></div>
              </a>
              <nav className="hidden items-center gap-6 text-sm font-semibold text-slate-600 md:flex" aria-label="Main navigation">
                <a href="#situacije" className="transition hover:text-trust-600">{c.nav.situations}</a>
                <a href="#kako" className="transition hover:text-trust-600">{c.nav.how}</a>
                <a href="#zajednica" className="transition hover:text-trust-600">{c.nav.board}</a>
              </nav>
              <div className="flex shrink-0 items-center gap-2">
                <div className="flex items-center rounded-full border border-slate-200 bg-slate-100 p-1 text-xs font-bold" role="group" aria-label="Language switcher">
                  <button type="button" onClick={() => setLang('exyu')} aria-pressed={lang === 'exyu'} className={cx('rounded-full px-2.5 py-1.5 transition sm:px-3', lang === 'exyu' ? 'bg-white text-trust-700 shadow-sm' : 'text-slate-500 hover:text-slate-800')}>🇧🇦 🇭🇷 <span className="hidden sm:inline">Ex-Yu</span></button>
                  <button type="button" onClick={() => setLang('ro')} aria-pressed={lang === 'ro'} className={cx('rounded-full px-2.5 py-1.5 transition sm:px-3', lang === 'ro' ? 'bg-white text-trust-700 shadow-sm' : 'text-slate-500 hover:text-slate-800')}>🇷🇴 <span className="hidden sm:inline">Română</span></button>
                </div>
                <button type="button" onClick={() => openIntake()} className="hidden items-center gap-2 rounded-xl bg-amber-500 px-3 py-2.5 text-xs font-extrabold text-white shadow-sm transition hover:bg-amber-600 focus:outline-none focus:ring-4 focus:ring-amber-100 sm:inline-flex sm:px-4 sm:text-sm"><Icon name="Siren" className="h-4 w-4" />{c.emergency}</button>
              </div>
            </div>
          </header>

          <main id="top">
            <section className="relative overflow-hidden border-b border-amber-100 bg-[#fffaf1]">
              <div className="absolute -right-32 -top-32 h-80 w-80 rounded-full bg-trust-100/70 blur-3xl" />
              <div className="absolute -bottom-40 -left-20 h-80 w-80 rounded-full bg-amber-100/70 blur-3xl" />
              <div className="relative mx-auto grid max-w-7xl gap-12 px-4 py-12 sm:px-6 sm:py-20 lg:grid-cols-[1.05fr_.95fr] lg:items-center lg:gap-16 lg:px-8 lg:py-24">
                <div>
                  <div className="inline-flex items-center gap-2 rounded-full border border-trust-200 bg-white/80 px-3 py-1.5 text-xs font-extrabold text-trust-700 shadow-sm sm:text-sm"><Icon name="HeartHandshake" className="h-4 w-4" />{c.hero.eyebrow}</div>
                  <h1 className="mt-5 max-w-3xl text-4xl font-black leading-[1.08] tracking-tight text-slate-950 sm:text-5xl lg:text-6xl">{c.hero.title}</h1>
                  <p className="mt-6 max-w-2xl text-lg leading-8 text-slate-600 sm:text-xl">{c.hero.description}</p>
                  <div className="mt-7 flex flex-wrap gap-2.5">{c.hero.tags.map(tag => <span key={tag} className="inline-flex items-center gap-1.5 rounded-full border border-slate-200 bg-white px-3 py-2 text-xs font-bold text-slate-700 shadow-sm"><Icon name="Check" className="h-3.5 w-3.5 text-safe-600" />{tag}</span>)}</div>
                  <p className="mt-6 flex items-start gap-2 text-sm font-semibold text-slate-600"><Icon name="Info" className="mt-0.5 h-4 w-4 shrink-0 text-trust-600" />{c.hero.reassurance}</p>
                </div>
                <div className="relative">
                  <div className="absolute -inset-3 rounded-[2rem] bg-trust-100/60 blur-xl" />
                  <div className={cx('relative rounded-[2rem] border bg-white p-5 shadow-lift sm:p-7', drag ? 'border-trust-600' : 'border-trust-200')} onDragOver={event => { event.preventDefault(); setDrag(true); }} onDragLeave={() => setDrag(false)} onDrop={event => { event.preventDefault(); setDrag(false); pick(event.dataTransfer.files); openIntake(); }}>
                    <div className="flex items-start gap-4"><div className="grid h-14 w-14 shrink-0 place-items-center rounded-2xl bg-trust-600 text-white shadow-lg"><Icon name="FileShield" className="h-7 w-7" /></div><div><p className="text-xs font-extrabold uppercase tracking-[.16em] text-trust-600">{lang === 'ro' ? 'Primul pas' : 'Prvi korak'}</p><h2 className="mt-1 text-2xl font-black leading-tight text-slate-950">{c.hero.cardTitle}</h2></div></div>
                    <p className="mt-5 leading-7 text-slate-600">{c.hero.cardText}</p>
                    <button type="button" onClick={() => openIntake()} className="mt-6 flex w-full items-center justify-center gap-2 rounded-2xl bg-trust-600 px-5 py-4 text-center text-base font-extrabold text-white shadow-lg shadow-trust-600/20 transition hover:bg-trust-700 focus:outline-none focus:ring-4 focus:ring-trust-100 sm:text-lg"><Icon name="UploadCloud" />{c.hero.cardButton}<Icon name="ArrowRight" className="h-5 w-5" /></button>
                    <div className="mt-5 rounded-2xl border-2 border-dashed border-slate-200 bg-slate-50 p-5 text-center"><p className="text-sm font-bold text-slate-700">{c.hero.dropHint}</p><p className="mt-1 text-xs text-slate-500">{c.hero.fileNote}</p></div>
                    <p className="mt-4 flex items-center justify-center gap-2 text-center text-xs font-medium text-slate-500"><Icon name="LockKeyhole" className="h-4 w-4 text-safe-600" />{lang === 'ro' ? 'Trimitere sigură către echipa de evaluare' : 'Sigurno slanje timu za procjenu'}</p>
                  </div>
                </div>
              </div>
            </section>

            <section id="kako" className="border-b border-slate-200 bg-white">
              <div className="mx-auto max-w-7xl px-4 py-16 sm:px-6 lg:px-8 lg:py-20">
                <div className="max-w-2xl"><p className="text-sm font-extrabold uppercase tracking-[.16em] text-trust-600">{c.how.eyebrow}</p><h2 className="mt-2 text-3xl font-black tracking-tight text-slate-950 sm:text-4xl">{c.how.title}</h2><p className="mt-4 text-lg leading-7 text-slate-600">{c.how.lead}</p></div>
                <div className="mt-10 grid gap-5 lg:grid-cols-3">{c.how.steps.map(([number, title, text, icon]) => <article key={number} className="rounded-3xl border border-slate-200 bg-slate-50 p-6 shadow-sm sm:p-7"><div className="flex items-center justify-between"><div className="grid h-12 w-12 place-items-center rounded-2xl bg-trust-50 text-trust-600"><Icon name={icon} /></div><span className="text-5xl font-black text-slate-200">{number}</span></div><h3 className="mt-6 text-xl font-extrabold text-slate-950">{title}</h3><p className="mt-3 leading-7 text-slate-600">{text}</p></article>)}</div>
              </div>
            </section>

            <section id="situacije" className="mx-auto max-w-7xl px-4 py-16 sm:px-6 lg:px-8 lg:py-20">
              <div className="max-w-3xl"><p className="text-sm font-extrabold uppercase tracking-[.16em] text-trust-600">{c.problems.eyebrow}</p><h2 className="mt-2 text-3xl font-black tracking-tight text-slate-950 sm:text-4xl">{c.problems.title}</h2><p className="mt-4 text-lg leading-7 text-slate-600">{c.problems.lead}</p></div>
              <div className="mt-10 grid gap-4 md:grid-cols-2 lg:grid-cols-3">{problems.map(problem => { const item = problem[lang]; const isOpen = expanded === problem.id; return <article key={problem.id} className={cx('rounded-3xl border bg-white p-5 shadow-soft transition sm:p-6', isOpen ? 'border-trust-300 ring-4 ring-trust-50 md:col-span-2 lg:col-span-2' : 'border-slate-200 hover:-translate-y-0.5 hover:border-trust-200')}>
                <button type="button" onClick={() => setExpanded(isOpen ? null : problem.id)} className="flex w-full items-start gap-4 text-left focus:outline-none focus:ring-4 focus:ring-trust-100"><div className={cx('grid h-12 w-12 shrink-0 place-items-center rounded-2xl border', toneClasses[problem.tone])}><Icon name={problem.icon} /></div><div className="min-w-0 flex-1"><div className="flex flex-wrap items-center gap-2"><span className="rounded-full bg-slate-100 px-2.5 py-1 text-[11px] font-extrabold uppercase tracking-wide text-slate-600">{item.tag}</span>{isOpen && <span className="text-xs font-bold text-trust-600">{c.problems.close}</span>}</div><h3 className="mt-2 text-lg font-extrabold leading-6 text-slate-950">{item.title}</h3></div><Icon name={isOpen ? 'ChevronUp' : 'ChevronDown'} className="mt-2 h-5 w-5 shrink-0 text-slate-400" /></button>
                {isOpen && <div className="mt-5 border-t border-slate-100 pt-5 md:ml-16"><div className="flex items-start gap-3 rounded-2xl bg-slate-50 p-4"><Icon name="BookOpen" className="mt-0.5 h-5 w-5 shrink-0 text-trust-600" /><p className="text-sm leading-6 text-slate-700">{item.info}</p></div><p className="mt-4 text-sm font-bold leading-6 text-slate-800">{item.action}</p><button type="button" onClick={() => openIntake(problem.id)} className="mt-5 inline-flex min-h-12 items-center gap-2 rounded-xl bg-trust-600 px-5 py-3 text-sm font-extrabold text-white transition hover:bg-trust-700 focus:outline-none focus:ring-4 focus:ring-trust-100"><Icon name="MessageCircle" className="h-4 w-4" />{c.problems.action}</button><p className="mt-4 text-xs leading-5 text-slate-500">{c.problems.note}</p></div>}
              </article>; })}</div>
            </section>

            <section id="zajednica" className="border-y border-amber-200 bg-[#fffdf4]">
              <div className="mx-auto max-w-7xl px-4 py-16 sm:px-6 lg:px-8 lg:py-20">
                <div className="flex flex-col gap-5 sm:flex-row sm:items-end sm:justify-between"><div><p className="text-sm font-extrabold uppercase tracking-[.16em] text-amber-700">{c.board.eyebrow}</p><h2 className="mt-2 text-3xl font-black tracking-tight text-slate-950 sm:text-4xl">{c.board.title}</h2></div><div className="max-w-xl rounded-2xl border border-amber-300 bg-amber-100/70 p-4 text-sm font-bold leading-6 text-amber-950"><Icon name="Megaphone" className="mb-1 inline-block h-4 w-4" /> {c.board.notice}</div></div>
                <div className="scrollbar-hide mt-8 flex gap-2 overflow-x-auto pb-2">{c.board.filters.map(([id, label]) => <button type="button" key={id} onClick={() => setBoardFilter(id)} aria-pressed={boardFilter === id} className={cx('shrink-0 rounded-full border px-4 py-2.5 text-sm font-extrabold transition', boardFilter === id ? 'border-trust-600 bg-trust-600 text-white' : 'border-slate-300 bg-white text-slate-700 hover:border-trust-300 hover:text-trust-700')}>{label}</button>)}</div>
                <div className="mt-7 grid gap-4 md:grid-cols-3">{filteredPosts.map(post => { const item = post[lang]; return <article key={post.id} className="rounded-3xl border border-slate-200 bg-white p-5 shadow-soft"><div className="flex items-start justify-between gap-3"><div className={cx('grid h-11 w-11 place-items-center rounded-2xl', post.tone === 'blue' ? 'bg-trust-50 text-trust-600' : post.tone === 'emerald' ? 'bg-safe-50 text-safe-700' : 'bg-amber-50 text-amber-700')}><Icon name={post.icon} /></div><span className="rounded-full bg-slate-100 px-2.5 py-1 text-[10px] font-extrabold uppercase tracking-wide text-slate-500">{c.board.sample}</span></div><h3 className="mt-5 text-lg font-extrabold leading-6 text-slate-950">{item.title}</h3><p className="mt-2 text-xs font-bold text-trust-600">{item.meta}</p><p className="mt-3 text-sm leading-6 text-slate-600">{item.text}</p></article>; })}</div>
              </div>
            </section>
          </main>

          <footer className="bg-slate-950 text-slate-300"><div className="mx-auto flex max-w-7xl flex-col gap-7 px-4 py-12 sm:px-6 lg:flex-row lg:items-start lg:justify-between lg:px-8"><div className="max-w-3xl"><div className="flex items-center gap-3"><div className="grid h-10 w-10 place-items-center rounded-2xl bg-trust-600 font-black text-white">A</div><span className="font-extrabold text-white">{c.brand}</span></div><h2 className="mt-6 text-xl font-extrabold text-white">{c.footer.title}</h2><p className="mt-3 text-sm leading-7 text-slate-400">{c.footer.disclaimer}</p></div><p className="shrink-0 text-xs font-semibold text-slate-500">{c.footer.demo}</p></div></footer>

          <button type="button" onClick={() => openIntake()} className="fixed bottom-4 right-4 z-20 inline-flex items-center gap-2 rounded-full bg-amber-500 px-4 py-3 text-sm font-extrabold text-white shadow-xl shadow-amber-500/20 transition hover:bg-amber-600 focus:outline-none focus:ring-4 focus:ring-amber-100 sm:hidden"><Icon name="Siren" className="h-4 w-4" />{c.emergency}</button>

          {intakeOpen && <Modal titleId="intake-title" onClose={() => setIntakeOpen(false)}>
            <div className="safe-bottom">
              <div className="flex items-start justify-between gap-4 border-b border-slate-100 p-5 sm:p-7"><div className="flex items-start gap-3"><div className="grid h-12 w-12 shrink-0 place-items-center rounded-2xl bg-trust-50 text-trust-600"><Icon name="FileCheck2" /></div><div><h2 id="intake-title" className="text-2xl font-black leading-tight text-slate-950">{c.form.title}</h2><p className="mt-2 text-sm leading-6 text-slate-600">{c.form.subtitle}</p></div></div><button type="button" onClick={() => setIntakeOpen(false)} aria-label={c.form.close} className="rounded-xl p-2 text-slate-400 transition hover:bg-slate-100 hover:text-slate-700"><Icon name="X" /></button></div>
              <form onSubmit={submitDocument} className="space-y-5 p-5 sm:p-7">
                <div className="grid gap-4 sm:grid-cols-2">
                  <label className="block text-sm font-extrabold text-slate-700">{c.form.name} <span className="font-normal text-slate-400">({c.form.nameHint})</span><input value={form.name} onChange={event => updateField('name', event.target.value)} className="mt-2 min-h-12 w-full rounded-xl border border-slate-300 px-3.5 font-normal outline-none transition focus:border-trust-500 focus:ring-4 focus:ring-trust-100" placeholder={lang === 'ro' ? 'Numele tău' : 'Tvoje ime'} /></label>
                  <label className="block text-sm font-extrabold text-slate-700">{c.form.email} <span className="text-red-500">*</span><span className="block text-xs font-normal text-slate-400">{c.form.emailHint}</span><input type="email" required value={form.email} onChange={event => updateField('email', event.target.value)} className="mt-2 min-h-12 w-full rounded-xl border border-slate-300 px-3.5 font-normal outline-none transition focus:border-trust-500 focus:ring-4 focus:ring-trust-100" placeholder="vi@email.com" /></label>
                  <label className="block text-sm font-extrabold text-slate-700">{c.form.phone} <span className="block text-xs font-normal text-slate-400">{c.form.phoneHint}</span><input type="tel" value={form.phone} onChange={event => updateField('phone', event.target.value)} className="mt-2 min-h-12 w-full rounded-xl border border-slate-300 px-3.5 font-normal outline-none transition focus:border-trust-500 focus:ring-4 focus:ring-trust-100" placeholder="+420 …" /></label>
                  <label className="block text-sm font-extrabold text-slate-700">{c.form.language}<select value={form.communication} onChange={event => updateField('communication', event.target.value)} className="mt-2 min-h-12 w-full rounded-xl border border-slate-300 bg-white px-3.5 font-normal outline-none transition focus:border-trust-500 focus:ring-4 focus:ring-trust-100"><option value="exyu">🇧🇦 🇭🇷 🇷🇸 Ex-Yu</option><option value="ro">🇷🇴 Română</option><option value="cs">Češki / Čeština</option></select></label>
                </div>
                <label className="block text-sm font-extrabold text-slate-700">{c.form.problem}<select value={form.problem} onChange={event => updateField('problem', event.target.value)} className="mt-2 min-h-12 w-full rounded-xl border border-slate-300 bg-white px-3.5 font-normal outline-none transition focus:border-trust-500 focus:ring-4 focus:ring-trust-100"><option value="">{c.form.chooseProblem}</option>{problems.map(problem => <option key={problem.id} value={problem.id}>{problem[lang].title}</option>)}<option value="other">{c.form.unsure}</option></select></label>
                <label className="block text-sm font-extrabold text-slate-700">{c.form.description}<textarea value={form.description} onChange={event => updateField('description', event.target.value)} rows="3" className="mt-2 w-full resize-none rounded-xl border border-slate-300 px-3.5 py-3 font-normal outline-none transition focus:border-trust-500 focus:ring-4 focus:ring-trust-100" placeholder={c.form.descriptionPlaceholder} /></label>
                <div><p className="text-sm font-extrabold text-slate-700">{c.form.document} <span className="text-red-500">*</span></p><div className={cx('mt-2 rounded-2xl border-2 border-dashed p-5 transition', drag ? 'border-trust-600 bg-trust-50' : 'border-slate-300 bg-slate-50')} onDragOver={event => { event.preventDefault(); setDrag(true); }} onDragLeave={() => setDrag(false)} onDrop={event => { event.preventDefault(); setDrag(false); pick(event.dataTransfer.files); }}><input ref={input} type="file" className="hidden" accept=".pdf,.jpg,.jpeg,.png" capture="environment" onChange={event => pick(event.target.files)} /><div className="flex flex-col items-center text-center"><Icon name="Camera" className="h-8 w-8 text-trust-600" /><p className="mt-2 text-sm font-bold text-slate-700">{file ? file.name : c.form.camera}</p><p className="mt-1 text-xs text-slate-500">{c.form.fileHint} · {c.hero.fileNote}</p><button type="button" onClick={() => input.current?.click()} className="mt-4 min-h-11 rounded-xl border border-trust-200 bg-white px-4 py-2.5 text-sm font-extrabold text-trust-700 transition hover:bg-trust-50">{file ? c.form.changeFile : c.form.camera}</button></div></div></div>
                <label className="flex items-start gap-3 rounded-2xl border border-slate-200 bg-slate-50 p-4 text-sm leading-6 text-slate-700"><input type="checkbox" checked={form.consent} onChange={event => updateField('consent', event.target.checked)} className="mt-1 h-5 w-5 shrink-0 rounded border-slate-300 text-trust-600 focus:ring-trust-500" />{c.form.consent}</label>
                <button type="submit" disabled={submission.state === 'loading'} className="flex min-h-13 w-full items-center justify-center gap-2 rounded-2xl bg-trust-600 px-5 py-4 text-base font-extrabold text-white shadow-lg shadow-trust-600/20 transition hover:bg-trust-700 focus:outline-none focus:ring-4 focus:ring-trust-100 disabled:cursor-wait disabled:opacity-60">{submission.state === 'loading' ? c.form.sending : c.form.submit}<Icon name="ArrowRight" /></button>
                <p className="flex items-start gap-2 text-xs leading-5 text-slate-500"><Icon name="ShieldCheck" className="mt-0.5 h-4 w-4 shrink-0 text-safe-600" />{c.form.security}</p>
                {submission.message && <div role="status" className={cx('rounded-xl border px-4 py-3 text-sm leading-6', submission.state === 'success' ? 'border-emerald-200 bg-emerald-50 text-emerald-800' : submission.state === 'error' ? 'border-red-200 bg-red-50 text-red-800' : 'border-trust-200 bg-trust-50 text-trust-800')}>{submission.message}</div>}
              </form>
            </div>
          </Modal>}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
