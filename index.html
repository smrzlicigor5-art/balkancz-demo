    function Icon({ name, className = 'h-5 w-5' }) {
      const ref = useRef(null);
      useEffect(() => {
        if (ref.current && window.lucide?.icons?.[name]) {
          ref.current.innerHTML = '';
          ref.current.appendChild(window.lucide.createElement(window.lucide.icons[name], { class: className }));
        }
      }, [name, className]);
      return <span ref={ref} aria-hidden="true" />;
    }

    function Modal({ titleId, onClose, children }) {
      useEffect(() => {
        const onKeyDown = event => event.key === 'Escape' && onClose();
        document.addEventListener('keydown', onKeyDown);
        return () => document.removeEventListener('keydown', onKeyDown);
      }, [onClose]);
      return (
        <div className="fixed inset-0 z-50 flex items-end justify-center bg-slate-950/50 p-0 backdrop-blur-sm sm:items-center sm:p-4" onMouseDown={event => event.target === event.currentTarget && onClose()}>
          <div role="dialog" aria-modal="true" aria-labelledby={titleId} className="max-h-[94vh] w-full overflow-y-auto rounded-t-3xl bg-white shadow-2xl sm:max-w-2xl sm:rounded-3xl">{children}</div>
        </div>
      );
    }

      const expertById = id => experts.find(expert => expert.id === id);

      const openIntake = (problemId = '', expertId = '') => {
        setForm(previous => ({ ...previous, problem: problemId || previous.problem, expert: expertId || previous.expert }));
        setSubmission({ state: 'idle', message: '' });
        setIntakeOpen(true);
      };

      const pick = candidateFiles => {
        const next = candidateFiles?.[0];
        if (!next) return;
        if (!ACCEPTED_TYPES.includes(next.type)) {
          setSubmission({ state: 'error', message: c.form.invalidFile });
          return;
        }
        if (next.size > MAX_FILE_SIZE) {
          setSubmission({ state: 'error', message: c.form.tooLarge });
          return;
        }
        setFile(next);
        setSubmission({ state: 'idle', message: '' });
      };

      const toDataUrl = selectedFile => new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(new Error(c.form.error));
        reader.readAsDataURL(selectedFile);
      });

      const submitDocument = async event => {
        event.preventDefault();
        if (!file) {
          setSubmission({ state: 'error', message: c.form.missingFile });
          return;
        }
        if (!form.email.trim() || !form.phone.trim() || !form.consent) {
          setSubmission({ state: 'error', message: c.form.missingBasics });
          return;
        }
        setSubmission({ state: 'loading', message: c.form.sending });
        try {
          const dataUrl = await toDataUrl(file);
          const response = await fetch('/api/submit', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              source: 'balkancz-vercel-demo',
              language: lang,
              submitted_at: new Date().toISOString(),
              client: { name: form.name.trim(), email: form.email.trim(), phone: form.phone.trim() },
              problem: selectedProblemTitle,
              problem_id: form.problem || 'other',
              expert: selectedExpert?.name || '',
              description: form.description.trim(),
              consent: form.consent,
              document: { filename: file.name, mime_type: file.type, size_bytes: file.size, data_url: dataUrl }
            })
          });
          const result = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(result.error || c.form.error);
          setSubmission({ state: 'success', message: c.form.success });
        } catch (error) {
          setSubmission({ state: 'error', message: lang === 'exyu' ? (error.message || c.form.error) : c.form.error });
        }
      };

      const askChat = question => {
        const nextQuestion = (question || '').trim() || c.chat.mockUser;
        setChatQuestion(nextQuestion);
        setChatAsked(true);
        setChatOpen(true);
      };

      const toneClasses = {
        amber: 'bg-amber-50 text-amber-700 border-amber-200',
        rose: 'bg-rose-50 text-rose-700 border-rose-200',
        red: 'bg-red-50 text-red-700 border-red-200',
        blue: 'bg-trust-50 text-trust-700 border-trust-200',
        violet: 'bg-violet-50 text-violet-700 border-violet-200',
        emerald: 'bg-safe-50 text-safe-700 border-emerald-200'
      };

      return (
        <div className="min-h-screen bg-slate-50">
          <div className="bg-trust-900 px-4 py-2 text-center text-xs font-semibold text-white sm:text-sm">{c.topBar}</div>

          <header className="sticky top-0 z-30 border-b border-slate-200/80 bg-white/95 backdrop-blur">
            <div className="mx-auto flex min-h-16 max-w-7xl items-center justify-between gap-3 px-4 sm:px-6 lg:px-8">
              <a href="#top" className="flex min-w-0 items-center gap-2.5" aria-label={c.brand}>
                <div className="grid h-10 w-10 shrink-0 place-items-center rounded-2xl bg-trust-600 text-lg font-black text-white shadow-sm">B</div>
                <div className="min-w-0"><div className="truncate font-extrabold tracking-tight text-slate-950">{c.brand}</div><div className="truncate text-[10px] font-medium text-slate-500 sm:text-xs">{c.brandSub}</div></div>
              </a>
              <nav className="hidden items-center gap-6 text-sm font-semibold text-slate-600 md:flex" aria-label="Main navigation">
                <a href="#situacije" className="transition hover:text-trust-600">{c.nav.problems}</a>
                <a href="#strucnjaci" className="transition hover:text-trust-600">{c.nav.experts}</a>
                <a href="#asistent" className="transition hover:text-trust-600">{c.nav.assistant}</a>
              </nav>
              <div className="flex shrink-0 items-center gap-2">
                <div className="flex items-center rounded-full border border-slate-200 bg-slate-100 p-1 text-xs font-bold" role="group" aria-label="Language switcher">
                  <button type="button" onClick={() => changeLanguage('exyu')} aria-pressed={lang === 'exyu'} className={cx('rounded-full px-2.5 py-1.5 transition sm:px-3', lang === 'exyu' ? 'bg-white text-trust-700 shadow-sm' : 'text-slate-500 hover:text-slate-800')}>🇧🇦 🇭🇷 <span className="hidden sm:inline">Ex-Yu</span></button>
                  <button type="button" onClick={() => changeLanguage('ro')} aria-pressed={lang === 'ro'} className={cx('rounded-full px-2.5 py-1.5 transition sm:px-3', lang === 'ro' ? 'bg-white text-trust-700 shadow-sm' : 'text-slate-500 hover:text-slate-800')}>🇷🇴 <span className="hidden sm:inline">Română</span></button>
                </div>
                <button type="button" onClick={() => setAccessOpen(true)} className="hidden items-center gap-2 rounded-xl bg-trust-600 px-3 py-2.5 text-xs font-extrabold text-white transition hover:bg-trust-700 focus:outline-none focus:ring-4 focus:ring-trust-100 sm:inline-flex sm:px-4 sm:text-sm"><Icon name="LogIn" className="h-4 w-4" />{c.nav.access}</button>
              </div>
            </div>
          </header>

          <main id="top">
            <section className="relative overflow-hidden border-b border-amber-100 bg-[#fffaf1]">
              <div className="absolute -right-32 -top-32 h-80 w-80 rounded-full bg-trust-100/70 blur-3xl" />
              <div className="absolute -bottom-40 -left-20 h-80 w-80 rounded-full bg-amber-100/70 blur-3xl" />
              <div className="relative mx-auto max-w-7xl px-4 py-12 sm:px-6 sm:py-20 lg:px-8 lg:py-24">
                <div className="max-w-3xl"><div className="inline-flex items-center gap-2 rounded-full border border-trust-200 bg-white/80 px-3 py-1.5 text-xs font-extrabold text-trust-700 shadow-sm sm:text-sm"><Icon name="HeartHandshake" className="h-4 w-4" />{c.hero.eyebrow}</div><h1 className="mt-5 text-5xl font-black leading-[1.04] tracking-tight text-slate-950 sm:text-6xl lg:text-7xl">{c.hero.title}</h1><p className="mt-6 max-w-2xl text-lg leading-8 text-slate-600 sm:text-xl">{c.hero.description}</p><div className="mt-7 flex flex-wrap gap-2.5">{c.hero.tags.map(tag => <span key={tag} className="inline-flex items-center gap-1.5 rounded-full border border-slate-200 bg-white px-3 py-2 text-xs font-bold text-slate-700 shadow-sm"><Icon name="Check" className="h-3.5 w-3.5 text-safe-600" />{tag}</span>)}</div><p className="mt-6 flex items-start gap-2 text-sm font-semibold text-slate-600"><Icon name="Info" className="mt-0.5 h-4 w-4 shrink-0 text-trust-600" />{c.hero.reassurance}</p></div>

                <div className="mt-12 grid gap-5 lg:grid-cols-2">
                  <div className="relative rounded-[2rem] border border-trust-200 bg-white p-5 shadow-lift sm:p-7" onDragOver={event => { event.preventDefault(); setDrag(true); }} onDragLeave={() => setDrag(false)} onDrop={event => { event.preventDefault(); setDrag(false); pick(event.dataTransfer.files); openIntake(); }}>
                    <div className="flex items-start gap-4"><div className="grid h-14 w-14 shrink-0 place-items-center rounded-2xl bg-trust-600 text-white shadow-lg"><Icon name="FileShield" className="h-7 w-7" /></div><div><p className="text-xs font-extrabold uppercase tracking-[.16em] text-trust-600">{c.hero.uploadEyebrow}</p><h2 className="mt-1 text-2xl font-black leading-tight text-slate-950">{c.hero.uploadTitle}</h2></div></div>
                    <p className="mt-5 leading-7 text-slate-600">{c.hero.uploadText}</p>
                    <button type="button" onClick={() => openIntake()} className="mt-6 flex w-full items-center justify-center gap-2 rounded-2xl bg-trust-600 px-5 py-4 text-center text-base font-extrabold text-white shadow-lg shadow-trust-600/20 transition hover:bg-trust-700 focus:outline-none focus:ring-4 focus:ring-trust-100"><Icon name="Camera" />{c.hero.uploadButton}<Icon name="ArrowRight" className="h-5 w-5" /></button>
                    <div className={cx('mt-5 rounded-2xl border-2 border-dashed p-5 text-center transition', drag ? 'border-trust-600 bg-trust-50' : 'border-slate-200 bg-slate-50')}><p className="text-sm font-bold text-slate-700">{c.hero.dropHint}</p><p className="mt-1 text-xs text-slate-500">{c.hero.fileNote}</p></div>
                  </div>

                  <div id="asistent" className="rounded-[2rem] border border-slate-200 bg-white p-5 shadow-soft sm:p-7">
                    <div className="flex items-start gap-4"><div className="grid h-14 w-14 shrink-0 place-items-center rounded-2xl bg-violet-50 text-violet-700"><Icon name="Bot" className="h-7 w-7" /></div><div><p className="text-xs font-extrabold uppercase tracking-[.16em] text-violet-700">{c.hero.chatEyebrow}</p><h2 className="mt-1 text-2xl font-black leading-tight text-slate-950">{c.hero.chatTitle}</h2></div></div>
                    <p className="mt-5 leading-7 text-slate-600">{c.hero.chatText}</p>
                    <form onSubmit={event => { event.preventDefault(); askChat(chatDraft); }} className="mt-6"><label className="sr-only" htmlFor="hero-chat-question">{c.chat.inputPlaceholder}</label><div className="flex items-center gap-2 rounded-2xl border border-slate-300 bg-slate-50 p-2 focus-within:border-trust-500 focus-within:ring-4 focus-within:ring-trust-100"><input id="hero-chat-question" value={chatDraft} onChange={event => setChatDraft(event.target.value)} className="min-w-0 flex-1 bg-transparent px-2 text-sm outline-none" placeholder={c.hero.chatPlaceholder} /><button type="submit" aria-label={c.chat.send} className="grid h-11 w-11 shrink-0 place-items-center rounded-xl bg-trust-600 text-white transition hover:bg-trust-700"><Icon name="Send" className="h-4 w-4" /></button></div></form>
                    <button type="button" onClick={() => askChat(chatDraft)} className="mt-4 inline-flex items-center gap-2 text-sm font-extrabold text-trust-700 hover:text-trust-900"><Icon name="MessageCircle" className="h-4 w-4" />{c.hero.chatButton}<Icon name="ArrowRight" className="h-4 w-4" /></button>
                  </div>
                </div>
              </div>
            </section>

            <section id="situacije" className="mx-auto max-w-7xl px-4 py-16 sm:px-6 lg:px-8 lg:py-20">
              <div className="max-w-3xl"><p className="text-sm font-extrabold uppercase tracking-[.16em] text-trust-600">{c.problems.eyebrow}</p><h2 className="mt-2 text-3xl font-black tracking-tight text-slate-950 sm:text-4xl">{c.problems.title}</h2><p className="mt-4 text-lg leading-7 text-slate-600">{c.problems.lead}</p></div>
              <div className="mt-10 grid gap-4 md:grid-cols-2 lg:grid-cols-3">{problems.map(problem => { const item = problem[lang]; const isOpen = expanded === problem.id; const cardExperts = problem.expertIds.map(expertById).filter(Boolean); return <article key={problem.id} className={cx('rounded-3xl border bg-white p-5 shadow-soft transition sm:p-6', isOpen ? 'border-trust-300 ring-4 ring-trust-50 md:col-span-2 lg:col-span-2' : 'border-slate-200 hover:-translate-y-0.5 hover:border-trust-200')}>
                <button type="button" onClick={() => setExpanded(isOpen ? null : problem.id)} className="flex w-full items-start gap-4 text-left focus:outline-none focus:ring-4 focus:ring-trust-100"><div className={cx('grid h-12 w-12 shrink-0 place-items-center rounded-2xl border', toneClasses[problem.tone])}><Icon name={problem.icon} /></div><div className="min-w-0 flex-1"><div className="flex flex-wrap items-center gap-2"><span className="rounded-full bg-slate-100 px-2.5 py-1 text-[11px] font-extrabold uppercase tracking-wide text-slate-600">{item.tag}</span>{isOpen && <span className="text-xs font-bold text-trust-600">{c.problems.close}</span>}</div><h3 className="mt-2 text-lg font-extrabold leading-6 text-slate-950">{item.title}</h3></div><Icon name={isOpen ? 'ChevronUp' : 'ChevronDown'} className="mt-2 h-5 w-5 shrink-0 text-slate-400" /></button>
                {isOpen && <div className="mt-5 border-t border-slate-100 pt-5 md:ml-16"><div className="rounded-2xl bg-slate-50 p-4"><div className="flex items-center gap-2 text-xs font-extrabold uppercase tracking-wide text-trust-700"><Icon name="Lightbulb" className="h-4 w-4" />{c.problems.quickInfo}</div><p className="mt-2 text-sm leading-6 text-slate-700">{item.info}</p></div><p className="mt-4 text-sm font-bold leading-6 text-slate-800">{item.action}</p><p className="mt-5 text-xs font-extrabold uppercase tracking-wide text-slate-500">{c.problems.experts}</p><div className="mt-2 flex flex-wrap gap-2">{cardExperts.map(expert => <button key={expert.id} type="button" onClick={() => openIntake(problem.id, expert.id)} className="inline-flex items-center gap-2 rounded-full border border-slate-200 bg-white px-3 py-2 text-xs font-bold text-slate-700 transition hover:border-trust-300 hover:text-trust-700"><span className={cx('grid h-6 w-6 place-items-center rounded-full text-[10px] font-black', expert.tone)}>{expert.initials}</span>{expert.name}<Icon name="BadgeCheck" className="h-3.5 w-3.5 text-trust-600" /></button>)}</div><div className="mt-5 flex flex-col gap-3 sm:flex-row sm:items-center"><button type="button" onClick={() => openIntake(problem.id)} className="inline-flex min-h-12 items-center justify-center gap-2 rounded-xl bg-trust-600 px-5 py-3 text-sm font-extrabold text-white transition hover:bg-trust-700 focus:outline-none focus:ring-4 focus:ring-trust-100"><Icon name="MessageCircle" className="h-4 w-4" />{c.problems.action}</button><span className="text-xs leading-5 text-slate-500">{c.problems.note}</span></div></div>}
              </article>; })}</div>
            </section>

            <section id="strucnjaci" className="border-y border-slate-200 bg-white">
              <div className="mx-auto max-w-7xl px-4 py-16 sm:px-6 lg:px-8 lg:py-20">
                <div className="max-w-3xl"><p className="text-sm font-extrabold uppercase tracking-[.16em] text-trust-600">{c.directory.eyebrow}</p><h2 className="mt-2 text-3xl font-black tracking-tight text-slate-950 sm:text-4xl">{c.directory.title}</h2><p className="mt-4 text-lg leading-7 text-slate-600">{c.directory.lead}</p></div>
                <div className="scrollbar-hide mt-10 flex gap-5 overflow-x-auto pb-4 lg:grid lg:grid-cols-3 lg:overflow-visible">{experts.map(expert => { const item = expert[lang]; return <article key={expert.id} className="min-w-[290px] rounded-3xl border border-slate-200 bg-slate-50 p-5 shadow-soft sm:p-6 lg:min-w-0"><div className="flex items-start gap-4"><div className="relative h-16 w-16 shrink-0 overflow-hidden rounded-2xl"><img src={expert.avatar} alt={expert.name} className="h-full w-full object-cover" onError={event => { event.currentTarget.style.display = 'none'; if (event.currentTarget.nextElementSibling) event.currentTarget.nextElementSibling.style.display = 'grid'; }} /><div className={cx('hidden h-full w-full place-items-center text-lg font-black', expert.tone)}>{expert.initials}</div></div><div className="min-w-0 flex-1"><h3 className="text-lg font-extrabold text-slate-950">{expert.name}</h3><div className="mt-1 flex items-center gap-1 text-xs font-bold text-trust-700"><Icon name="BadgeCheck" className="h-3.5 w-3.5" />{c.directory.verified}</div></div></div><p className="mt-5 text-sm font-extrabold text-slate-800">{item.badge}</p><p className="mt-1 text-sm font-bold text-trust-700">{item.specialization}</p><p className="mt-3 text-sm leading-6 text-slate-600">{item.bio}</p><button type="button" onClick={() => openIntake('', expert.id)} className="mt-5 flex min-h-11 w-full items-center justify-center gap-2 rounded-xl border border-trust-200 bg-white px-4 py-3 text-sm font-extrabold text-trust-700 transition hover:bg-trust-50"><Icon name="Send" className="h-4 w-4" />{c.directory.ask} {expert.name}</button></article>; })}</div>
              </div>
            </section>
          </main>

          <footer className="bg-slate-950 text-slate-300"><div className="mx-auto flex max-w-7xl flex-col gap-7 px-4 py-12 sm:px-6 lg:flex-row lg:items-start lg:justify-between lg:px-8"><div className="max-w-3xl"><div className="flex items-center gap-3"><div className="grid h-10 w-10 place-items-center rounded-2xl bg-trust-600 font-black text-white">B</div><span className="font-extrabold text-white">{c.brand}</span></div><h2 className="mt-6 text-xl font-extrabold text-white">{c.footer.title}</h2><p className="mt-3 text-sm leading-7 text-slate-400">{c.footer.disclaimer}</p></div><p className="shrink-0 text-xs font-semibold text-slate-500">{c.footer.demo}</p></div></footer>

          {chatOpen && <div className="fixed bottom-24 right-4 z-40 w-[calc(100vw-2rem)] max-w-sm overflow-hidden rounded-3xl border border-trust-200 bg-white shadow-2xl sm:bottom-24 sm:right-6" role="dialog" aria-label={c.chat.title}><div className="flex items-center justify-between bg-trust-600 px-4 py-4 text-white"><div className="flex items-center gap-3"><div className="grid h-10 w-10 place-items-center rounded-2xl bg-white/15"><Icon name="Bot" /></div><div><p className="font-extrabold">{c.chat.title}</p><p className="text-xs text-trust-100">{c.chat.status}</p></div></div><button type="button" onClick={() => setChatOpen(false)} aria-label={c.chat.close} className="rounded-lg p-2 text-trust-100 hover:bg-white/10 hover:text-white"><Icon name="X" /></button></div><div className="max-h-[55vh] space-y-4 overflow-y-auto bg-slate-50 p-4"><div className="ml-8 rounded-2xl rounded-tr-sm bg-trust-600 p-3 text-sm leading-6 text-white">{chatAsked ? chatQuestion : c.chat.mockUser}</div><div className="mr-4 rounded-2xl rounded-tl-sm border border-slate-200 bg-white p-3 text-sm leading-6 text-slate-700 shadow-sm">{c.chat.answer}</div><button type="button" onClick={() => { setChatOpen(false); openIntake(); }} className="flex w-full items-center justify-center gap-2 rounded-xl border border-trust-200 bg-white px-4 py-3 text-sm font-extrabold text-trust-700 transition hover:bg-trust-50"><Icon name="FileCheck2" className="h-4 w-4" />{c.chat.sendToExpert}</button><p className="text-center text-[11px] leading-5 text-slate-500">{c.chat.disclaimer}</p></div><form onSubmit={event => { event.preventDefault(); askChat(chatDraft); }} className="flex gap-2 border-t border-slate-200 bg-white p-3"><input value={chatDraft} onChange={event => setChatDraft(event.target.value)} className="min-w-0 flex-1 rounded-xl border border-slate-300 px-3 py-2.5 text-sm outline-none focus:border-trust-500 focus:ring-4 focus:ring-trust-100" placeholder={c.chat.inputPlaceholder} /><button type="submit" aria-label={c.chat.send} className="grid h-11 w-11 shrink-0 place-items-center rounded-xl bg-trust-600 text-white hover:bg-trust-700"><Icon name="Send" className="h-4 w-4" /></button></form></div>}

          <button type="button" onClick={() => setChatOpen(previous => !previous)} aria-label={chatOpen ? c.chat.close : c.chat.title} className="fixed bottom-5 right-4 z-40 grid h-14 w-14 place-items-center rounded-full bg-trust-600 text-white shadow-xl shadow-trust-600/30 transition hover:scale-105 hover:bg-trust-700 focus:outline-none focus:ring-4 focus:ring-trust-100 sm:bottom-6 sm:right-6"><Icon name={chatOpen ? 'X' : 'MessageCircle'} className="h-6 w-6" /></button>

          {intakeOpen && <Modal titleId="intake-title" onClose={() => setIntakeOpen(false)}>
            <div className="safe-bottom">
              <div className="flex items-start justify-between gap-4 border-b border-slate-100 p-5 sm:p-7"><div className="flex items-start gap-3"><div className="grid h-12 w-12 shrink-0 place-items-center rounded-2xl bg-trust-50 text-trust-600"><Icon name="FileCheck2" /></div><div><h2 id="intake-title" className="text-2xl font-black leading-tight text-slate-950">{c.form.title}</h2><p className="mt-2 text-sm leading-6 text-slate-600">{c.form.subtitle}</p>{selectedExpert && <p className="mt-3 inline-flex items-center gap-2 rounded-full bg-trust-50 px-3 py-1.5 text-xs font-extrabold text-trust-700"><Icon name="BadgeCheck" className="h-3.5 w-3.5" />{c.form.selectedExpert}: {selectedExpert.name}</p>}</div></div><button type="button" onClick={() => setIntakeOpen(false)} aria-label={c.form.close} className="rounded-xl p-2 text-slate-400 transition hover:bg-slate-100 hover:text-slate-700"><Icon name="X" /></button></div>
              <form onSubmit={submitDocument} className="space-y-5 p-5 sm:p-7">
                <div className="grid gap-4 sm:grid-cols-2">
                  <label className="block text-sm font-extrabold text-slate-700">{c.form.name} <span className="font-normal text-slate-400">({c.form.nameHint})</span><input value={form.name} onChange={event => updateField('name', event.target.value)} className="mt-2 min-h-12 w-full rounded-xl border border-slate-300 px-3.5 font-normal outline-none transition focus:border-trust-500 focus:ring-4 focus:ring-trust-100" placeholder={lang === 'ro' ? 'Numele tău' : 'Tvoje ime'} /></label>
                  <label className="block text-sm font-extrabold text-slate-700">{c.form.email} <span className="text-red-500">*</span><input type="email" required value={form.email} onChange={event => updateField('email', event.target.value)} className="mt-2 min-h-12 w-full rounded-xl border border-slate-300 px-3.5 font-normal outline-none transition focus:border-trust-500 focus:ring-4 focus:ring-trust-100" placeholder="vi@email.com" /></label>
                  <label className="block text-sm font-extrabold text-slate-700">{c.form.phone} <span className="text-red-500">*</span><span className="block text-xs font-normal text-slate-400">{c.form.phoneHint}</span><input type="tel" required value={form.phone} onChange={event => updateField('phone', event.target.value)} className="mt-2 min-h-12 w-full rounded-xl border border-slate-300 px-3.5 font-normal outline-none transition focus:border-trust-500 focus:ring-4 focus:ring-trust-100" placeholder="+420 …" /></label>
                  <label className="block text-sm font-extrabold text-slate-700">{c.form.problem}<select value={form.problem} onChange={event => updateField('problem', event.target.value)} className="mt-2 min-h-12 w-full rounded-xl border border-slate-300 bg-white px-3.5 font-normal outline-none transition focus:border-trust-500 focus:ring-4 focus:ring-trust-100"><option value="">{c.form.chooseProblem}</option>{problems.map(problem => <option key={problem.id} value={problem.id}>{problem[lang].title}</option>)}<option value="other">{c.form.unsure}</option></select></label>
                </div>
                <label className="block text-sm font-extrabold text-slate-700">{c.form.description}<textarea value={form.description} onChange={event => updateField('description', event.target.value)} rows="3" className="mt-2 w-full resize-none rounded-xl border border-slate-300 px-3.5 py-3 font-normal outline-none transition focus:border-trust-500 focus:ring-4 focus:ring-trust-100" placeholder={c.form.descriptionPlaceholder} /></label>
                <div><p className="text-sm font-extrabold text-slate-700">{c.form.document} <span className="text-red-500">*</span></p><div className={cx('mt-2 rounded-2xl border-2 border-dashed p-5 transition', drag ? 'border-trust-600 bg-trust-50' : 'border-slate-300 bg-slate-50')} onDragOver={event => { event.preventDefault(); setDrag(true); }} onDragLeave={() => setDrag(false)} onDrop={event => { event.preventDefault(); setDrag(false); pick(event.dataTransfer.files); }}><input ref={input} type="file" className="hidden" accept=".pdf,.jpg,.jpeg,.png" capture="environment" onChange={event => pick(event.target.files)} /><div className="flex flex-col items-center text-center"><Icon name="Camera" className="h-8 w-8 text-trust-600" /><p className="mt-2 text-sm font-bold text-slate-700">{file ? file.name : c.form.camera}</p><p className="mt-1 text-xs text-slate-500">{c.form.fileHint} · {c.hero.fileNote}</p><button type="button" onClick={() => input.current?.click()} className="mt-4 min-h-11 rounded-xl border border-trust-200 bg-white px-4 py-2.5 text-sm font-extrabold text-trust-700 transition hover:bg-trust-50">{file ? c.form.changeFile : c.form.camera}</button></div></div></div>
                <label className="flex items-start gap-3 rounded-2xl border border-slate-200 bg-slate-50 p-4 text-sm leading-6 text-slate-700"><input type="checkbox" checked={form.consent} onChange={event => updateField('consent', event.target.checked)} className="mt-1 h-5 w-5 shrink-0 rounded border-slate-300 text-trust-600 focus:ring-trust-500" />{c.form.consent}</label>
                <button type="submit" disabled={submission.state === 'loading'} className="flex min-h-13 w-full items-center justify-center gap-2 rounded-2xl bg-trust-600 px-5 py-4 text-base font-extrabold text-white shadow-lg shadow-trust-600/20 transition hover:bg-trust-700 focus:outline-none focus:ring-4 focus:ring-trust-100 disabled:cursor-wait disabled:opacity-60">{submission.state === 'loading' ? c.form.sending : c.form.submit}<Icon name="ArrowRight" /></button>
                <p className="rounded-2xl border border-amber-200 bg-amber-50 p-4 text-sm font-bold leading-6 text-amber-950">{c.form.disclaimer}</p>
                <p className="flex items-start gap-2 text-xs leading-5 text-slate-500"><Icon name="ShieldCheck" className="mt-0.5 h-4 w-4 shrink-0 text-safe-600" />{c.form.security}</p>
                {submission.message && <div role="status" className={cx('rounded-xl border px-4 py-3 text-sm leading-6', submission.state === 'success' ? 'border-emerald-200 bg-emerald-50 text-emerald-800' : submission.state === 'error' ? 'border-red-200 bg-red-50 text-red-800' : 'border-trust-200 bg-trust-50 text-trust-800')}>{submission.message}</div>}
              </form>
            </div>
          </Modal>}

          {accessOpen && <Modal titleId="access-title" onClose={() => setAccessOpen(false)}>
            <div className="p-5 sm:p-7"><div className="flex items-start justify-between gap-4"><div><span className="inline-flex rounded-full bg-trust-50 px-3 py-1 text-xs font-extrabold uppercase tracking-wide text-trust-700">BalkanCZ Asistent</span><h2 id="access-title" className="mt-3 text-2xl font-black text-slate-950">{c.nav.accessTitle}</h2><p className="mt-2 leading-6 text-slate-600">{c.nav.accessText}</p></div><button type="button" onClick={() => setAccessOpen(false)} aria-label={c.nav.close} className="rounded-xl p-2 text-slate-400 hover:bg-slate-100"><Icon name="X" /></button></div><div className="mt-7 grid gap-3 sm:grid-cols-2"><button type="button" onClick={() => { setAccessOpen(false); document.getElementById('strucnjaci')?.scrollIntoView({ behavior: 'smooth' }); }} className="flex min-h-14 items-center justify-center gap-2 rounded-2xl border border-trust-200 bg-trust-50 px-4 py-3 text-sm font-extrabold text-trust-700 hover:bg-trust-100"><Icon name="BadgeCheck" />{c.nav.login}</button><button type="button" onClick={() => { setAccessOpen(false); openIntake(''); }} className="flex min-h-14 items-center justify-center gap-2 rounded-2xl bg-trust-600 px-4 py-3 text-sm font-extrabold text-white hover:bg-trust-700"><Icon name="Megaphone" />{c.nav.post}</button></div></div>
          </Modal>}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
