        },
        problems: {

          aiMsg: 'Pentru cererile OAMP, traducerea autorizată nu este necesară în fiecare situație. Depinde de document și de instrucțiunile primite; dacă scrisoarea cere traducere oficială sau completări, un specialist o poate verifica înainte să răspunzi.',
          aiButton: 'Trimite scrisoarea specialistului', inputPlaceholder: 'Scrie o întrebare…', send: 'Trimite', close: 'Închide asistentul',
          thinking: 'Verific întrebarea…', demoLabel: 'Răspuns demo', liveLabel: 'Răspuns AI', disclaimer: 'AI oferă informații generale, nu consultanță juridică.'
        },
        form: {
          title: 'Evaluare gratuită a cazului tău', name: 'Nume și prenume', email: 'E-mail pentru confirmare', contact: 'Contact (număr WhatsApp)', contactHint: 'important pentru răspuns rapid',
          problemType: 'Tipul problemei', problemPlaceholder: 'Alege tipul problemei', description: 'Descriere scurtă', descriptionPlaceholder: 'Ce s-a întâmplat? Scrie pe scurt…',
          upload: 'Încarcă documentul', uploadHint: 'Trage fișierul aici sau apasă pentru a-l selecta', chooseFile: 'Alege o imagine sau un PDF', changeFile: 'Schimbă documentul',
          consent: 'Sunt de acord să fiu contactat în legătură cu această solicitare.', submit: 'Cere oferta specialistului', sending: 'Trimitem întrebarea…',
          trust: 'Fără costuri ascunse. Primești prețul fix al soluției înainte să plătești ceva.', security: 'Documentul este verificat doar de echipa noastră.', close: 'Închide',
          missingFile: 'Adaugă mai întâi o fotografie sau un PDF.', missingBasics: 'Introdu e-mailul și numărul WhatsApp și acceptă contactul.', invalidFile: 'Alege un document PDF, JPG sau PNG.',
          tooLarge: 'Documentul este prea mare. Dimensiunea maximă este de 3 MB.', success: 'Întrebarea a fost primită. Am trimis confirmarea pe e-mail.', error: 'Momentan nu putem trimite întrebarea. Încearcă din nou.'
        },

    };

    const problems = [
      { id: 'office', icon: 'MailWarning', accent: '#1B4F91', exyu: { title: 'Pismo od úřada / Datová schránka', desc: 'Ne razumiješ šta piše, rok ističe', tag: 'Rokovi', info: 'Službeno pismo može sadržavati važan rok. Točan početak i duljina roka ovise o dokumentu i načinu dostave.', action: 'Pošalji nam pismo da provjerimo što trebaš napraviti.', expertIds: ['jelena'] }, ro: { title: 'Scrisoare de la úřad / Cutie de date', desc: 'Nu înțelegi ce scrie, termenul expiră', tag: 'Termene', info: 'O scrisoare oficială poate conține un termen important. Data exactă și procedura depind de document și de modul comunicării.', action: 'Trimite-ne scrisoarea pentru a verifica următorul pas.', expertIds: ['jelena'] } },
      { id: 'housing', icon: 'KeyRound', accent: '#3D7DD8', exyu: { title: 'Stanodavac i kaucija', desc: 'Ugovor, otkaz, povrat depozita', tag: 'Najam', info: 'Kod kaucije i obračuna režija važno je sačuvati ugovor, primopredajni zapisnik i račune. Stručnjak može pomoći sastaviti jasan dopis.', action: 'Imaš problem sa stanom? Pošalji upit stručnjaku.', expertIds: ['amira'] }, ro: { title: 'Proprietar și garanție', desc: 'Contract, reziliere, returnare depozit', tag: 'Chirie', info: 'Pentru garanție și utilități sunt importante contractul, procesul-verbal și facturile. Un specialist te poate ajuta cu o solicitare clară.', action: 'Ai o problemă cu locuința? Trimite o întrebare.', expertIds: ['amira'] } },
      { id: 'health', icon: 'Activity', accent: '#E2811E', exyu: { title: 'Zdravstveno (VZP) i dugovi', desc: 'Osiguranje, neplaćeni računi', tag: 'Zdravlje', info: 'Obveze ovise o promjeni posla, ugovora i statusa osiguranja. Kod dopisa VZP-a najprije treba provjeriti točan dokument i rok.', action: 'Pošalji dopis ili opiši situaciju za besplatnu provjeru.', expertIds: ['jelena'] }, ro: { title: 'Asigurare (VZP) și datorii', desc: 'Asigurare, facturi neplătite', tag: 'Sănătate', info: 'Obligațiile depind de schimbarea locului de muncă, contractului și statutului de asigurare. Verifică documentul și termenul exact.', action: 'Trimite scrisoarea sau descrie situația pentru o verificare gratuită.', expertIds: ['jelena'] } },
      { id: 'work', icon: 'Briefcase', accent: '#1B4F91', exyu: { title: 'Posao i neisplaćena plaća', desc: 'Ugovor o radu, kašnjenje isplate', tag: 'Posao', info: 'Sačuvaj ugovor, platne liste i komunikaciju s poslodavcem ili agencijom. To pomaže pri provjeri neisplaćene plaće.', action: 'Pošalji ugovor ili platnu listu na pregled.', expertIds: ['drasko'] }, ro: { title: 'Loc de muncă și salariu neplătit', desc: 'Contract, întârziere plată', tag: 'Muncă', info: 'Păstrează contractul, fluturașii și comunicarea cu angajatorul sau agenția. Acestea ajută la verificarea problemei.', action: 'Trimite contractul sau fluturașul pentru o verificare.', expertIds: ['drasko'] } },
      { id: 'baby', icon: 'Baby', accent: '#3D7DD8', exyu: { title: 'Rođenje djeteta i OAMP', desc: 'Prijava, dokumenti, dozvola boravka', tag: 'Obitelj', info: 'Kod rođenja djeteta postupak ovisi o statusu roditelja i dokumentima koje traži nadležna institucija. Ne šalji rok napamet bez pregleda dopisa.', action: 'Pošalji dopis ili popis dokumenata stručnjaku.', expertIds: ['jelena'] }, ro: { title: 'Nașterea copilului și OAMP', desc: 'Înregistrare, acte, permis de ședere', tag: 'Familie', info: 'Procedura depinde de statutul părinților și de documentele cerute de instituție. Nu presupune termenul fără verificarea scrisorii.', action: 'Trimite scrisoarea sau lista actelor unui specialist.', expertIds: ['jelena'] } },
      { id: 'osvc', icon: 'Car', accent: '#E2811E', exyu: { title: 'OSVČ (Paušal i Bolt)', desc: 'Obrt, paušalni porez, prijave', tag: 'Porezi', info: 'Za OSVČ je važno pratiti datovou schránku, zálohy i porezne rokove. Kod konkretnog dopisa prvo treba utvrditi instituciju i obvezu.', action: 'Pošalji dopis ili pitanje za administrativnu podršku.', expertIds: ['amira'] }, ro: { title: 'OSVČ (impozit forfetar și Bolt)', desc: 'Autorizație, impozit forfetar, declarații', tag: 'Taxe', info: 'Pentru OSVČ este important să urmărești datová schránka, avansurile și termenele fiscale. Verifică mai întâi instituția și obligația exactă.', action: 'Trimite scrisoarea sau întrebarea pentru ajutor administrativ.', expertIds: ['amira'] } }
    ];

    const experts = [
      { id: 'jelena', name: 'Jelena M.', initials: 'JM', bg: '#EAF1FB', color: '#1B4F91', exyu: { spec: 'Vize, VZP, OAMP', bio: 'Pomaže ljudima razumjeti službena pisma i pripremiti dokumente.' }, ro: { spec: 'Vize, VZP, OAMP', bio: 'Ajută oamenii să înțeleagă scrisorile oficiale și să pregătească documentele.' } },
      { id: 'drasko', name: 'Draško P.', initials: 'DP', bg: '#EFF5FD', color: '#3D7DD8', exyu: { spec: 'Radno pravo, plaće', bio: 'Pomaže provjeriti ugovore, platne liste i komunikaciju s agencijama.' }, ro: { spec: 'Dreptul muncii, salarii', bio: 'Ajută la verificarea contractelor, fluturașilor și comunicării cu agențiile.' } },
      { id: 'amira', name: 'Amira S.', initials: 'AS', bg: '#FCF0E1', color: '#B8650F', exyu: { spec: 'Stanovanje, kaucije, OSVČ', bio: 'Pomaže najmoprimcima, vozačima i OSVČ osobama s administracijom.' }, ro: { spec: 'Locuință, garanții, OSVČ', bio: 'Ajută chiriașii, șoferii și persoanele OSVČ cu administrația de zi cu zi.' } }
    ];

    function Icon({ name, className = 'h-5 w-5' }) {
      const ref = useRef(null);
      useEffect(() => {
        if (ref.current && window.lucide?.icons?.[name]) {
          ref.current.innerHTML = '';
          ref.current.appendChild(window.lucide.createElement(window.lucide.icons[name], { class: className }));
        }
      }, [name, className]);
      return <span ref={ref} aria-hidden="true" />;
    }

    function Modal({ titleId, onClose, children }) {
      useEffect(() => {
        const onKey = event => event.key === 'Escape' && onClose();
        document.addEventListener('keydown', onKey);
        return () => document.removeEventListener('keydown', onKey);
      }, [onClose]);
      return <div className="fixed inset-0 z-50 flex items-end justify-center bg-ink/50 p-0 backdrop-blur-sm sm:items-center sm:p-4" onMouseDown={event => event.target === event.currentTarget && onClose()}><div role="dialog" aria-modal="true" aria-labelledby={titleId} className="max-h-[92vh] w-full overflow-y-auto rounded-t-card bg-white shadow-trust sm:max-w-xl sm:rounded-card">{children}</div></div>;
    }

    function App() {
      const [lang, setLang] = useState('exyu');
      const c = copy[lang];
      const [modalOpen, setModalOpen] = useState(false);
      const [chatOpen, setChatOpen] = useState(false);
      const [expanded, setExpanded] = useState(null);
      const [file, setFile] = useState(null);
      const [dragActive, setDragActive] = useState(false);
      const [submission, setSubmission] = useState({ state: 'idle', message: '' });
      const [form, setForm] = useState({ name: '', email: '', phone: '', problem: '', description: '', expert: '', consent: false });
      const [chatDraft, setChatDraft] = useState('');
      const [chatQuestion, setChatQuestion] = useState('');
      const [chatAsked, setChatAsked] = useState(false);
      const [chatAnswer, setChatAnswer] = useState('');
      const [chatMode, setChatMode] = useState('demo');
      const [chatState, setChatState] = useState('idle');
      const input = useRef(null);

      useEffect(() => { document.documentElement.lang = lang === 'ro' ? 'ro' : 'hr'; }, [lang]);
      const updateField = (field, value) => setForm(previous => ({ ...previous, [field]: value }));
      const currentProblem = problems.find(item => item.id === form.problem);
      const selectedProblemTitle = currentProblem?.[lang]?.title || (lang === 'ro' ? 'Altă situație' : 'Druga situacija');
      const selectedExpert = experts.find(item => item.id === form.expert);
      const expertById = id => experts.find(item => item.id === id);

      const openModal = (problemId = '', expertId = '') => {
        setForm(previous => ({ ...previous, problem: problemId || previous.problem, expert: expertId || previous.expert }));
        setSubmission({ state: 'idle', message: '' }); setChatOpen(false); setModalOpen(true);
      };
      const closeModal = () => { setModalOpen(false); setSubmission({ state: 'idle', message: '' }); };
      const pick = candidateFiles => {
        const next = candidateFiles?.[0];
        if (!next) return;
        if (!ACCEPTED_TYPES.includes(next.type)) { setSubmission({ state: 'error', message: c.form.invalidFile }); return; }
        if (next.size > MAX_FILE_SIZE) { setSubmission({ state: 'error', message: c.form.tooLarge }); return; }
        setFile(next); setSubmission({ state: 'idle', message: '' });
      };
      const toDataUrl = selectedFile => new Promise((resolve, reject) => { const reader = new FileReader(); reader.onload = () => resolve(reader.result); reader.onerror = () => reject(new Error(c.form.error)); reader.readAsDataURL(selectedFile); });
      const submitDocument = async event => {
        event.preventDefault();
        if (!file) { setSubmission({ state: 'error', message: c.form.missingFile }); return; }
        if (!form.email.trim() || !form.phone.trim() || !form.consent) { setSubmission({ state: 'error', message: c.form.missingBasics }); return; }
        setSubmission({ state: 'loading', message: c.form.sending });
        try {
          const dataUrl = await toDataUrl(file);
          const response = await fetch('/api/submit', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ source: 'balkancz-vercel-demo', language: lang, communication_language: lang === 'ro' ? 'ro' : 'exyu', submitted_at: new Date().toISOString(), client: { name: form.name.trim(), email: form.email.trim(), phone: form.phone.trim() }, problem: selectedProblemTitle, problem_id: form.problem || 'other', expert: selectedExpert?.name || '', description: form.description.trim(), consent: form.consent, document: { filename: file.name, mime_type: file.type, size_bytes: file.size, data_url: dataUrl } }) });
          const result = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(result.error || c.form.error);
          setSubmission({ state: 'success', message: c.form.success });
        } catch (error) { setSubmission({ state: 'error', message: lang === 'exyu' ? (error.message || c.form.error) : c.form.error }); }
      };
      const askChat = async question => {
        const nextQuestion = (question || '').trim() || c.chat.userMsg;
        setChatQuestion(nextQuestion); setChatAsked(true); setChatOpen(true); setChatAnswer(''); setChatMode('demo'); setChatState('loading');
        try {
          const response = await fetch('/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ question: nextQuestion, language: lang }) });
          const result = await response.json().catch(() => ({}));
          if (!response.ok || !result.answer) throw new Error('Chat unavailable');
          setChatAnswer(result.answer); setChatMode(result.mode === 'openai' ? 'openai' : 'demo'); setChatState('ready');
        } catch { setChatAnswer(c.chat.aiMsg); setChatMode('demo'); setChatState('ready'); }
      };

      return <div className="min-h-screen bg-paper">
        <header className="sticky top-0 z-40 border-b border-line bg-paper/90 backdrop-blur"><div className="mx-auto flex max-w-6xl items-center justify-between gap-3 px-4 py-3 sm:px-6"><a href="#top" className="flex items-center gap-2" aria-label={c.brand}><div className="flex h-9 w-9 items-center justify-center rounded-item bg-trust text-white"><Icon name="ShieldCheck" className="h-5 w-5" /></div><span className="font-display text-lg font-extrabold tracking-tight text-ink">{c.brand}</span></a><div className="flex items-center gap-2 sm:gap-3"><div className="flex items-center rounded-item border border-line bg-white p-0.5 text-sm" role="group" aria-label="Language switcher"><button type="button" onClick={() => setLang('exyu')} aria-pressed={lang === 'exyu'} className={cx('rounded-[7px] px-2.5 py-1.5 font-medium transition-colors sm:px-3', lang === 'exyu' ? 'bg-trust text-white' : 'text-ink-soft hover:text-ink')}>🇧🇦🇭🇷🇷🇸 <span className="hidden sm:inline">Ex-Yu</span></button><button type="button" onClick={() => setLang('ro')} aria-pressed={lang === 'ro'} className={cx('rounded-[7px] px-2.5 py-1.5 font-medium transition-colors sm:px-3', lang === 'ro' ? 'bg-trust text-white' : 'text-ink-soft hover:text-ink')}>🇷🇴 <span className="hidden sm:inline">Română</span></button></div><button type="button" onClick={() => openModal()} className="hidden rounded-item bg-trust px-4 py-2 text-sm font-semibold text-white shadow-trust-sm transition-transform hover:-translate-y-0.5 sm:block">{c.nav.report}</button><button type="button" onClick={() => openModal()} aria-label={c.nav.report} className="rounded-item bg-trust px-3 py-2 text-sm font-semibold text-white shadow-trust-sm sm:hidden">{c.nav.report}</button></div></div></header>

        <main id="top">
          <section className="mx-auto max-w-6xl px-4 pt-10 sm:px-6 sm:pt-16"><div className="max-w-2xl"><h1 className="font-display text-4xl font-extrabold leading-[1.08] tracking-tight text-ink sm:text-5xl">{c.hero.headline}</h1><p className="mt-4 text-base leading-relaxed text-ink-soft sm:text-lg">{c.hero.sub}</p></div><div className="mt-8 grid grid-cols-1 gap-4 sm:mt-10 lg:grid-cols-5"><button type="button" onClick={() => openModal()} className="group relative overflow-hidden rounded-card bg-trust p-6 text-left shadow-trust transition-transform hover:-translate-y-1 sm:p-8 lg:col-span-3"><div className="pointer-events-none absolute -right-10 -top-10 h-40 w-40 rounded-full bg-white/10" aria-hidden="true" /><div className="relative flex items-start justify-between gap-4"><div className="flex h-11 w-11 shrink-0 items-center justify-center rounded-item bg-amber text-white"><Icon name="Camera" className="h-5 w-5" /></div><Icon name="ArrowUpRight" className="h-6 w-6 text-white/70 transition-transform group-hover:translate-x-0.5 group-hover:-translate-y-0.5" /></div><p className="relative mt-6 text-sm font-semibold uppercase tracking-wide text-amber-light/90">{c.hero.fastTrackLabel}</p><p className="relative mt-1 font-display text-xl font-bold leading-snug text-white sm:text-2xl">{c.hero.fastTrackText}</p><span className="relative mt-5 inline-flex items-center gap-2 rounded-item bg-white px-4 py-2.5 text-sm font-semibold text-trust">{c.hero.fastTrackButton}<Icon name="ArrowRight" className="h-4 w-4" /></span></button><button type="button" onClick={() => { setChatOpen(true); setModalOpen(false); }} className="group relative overflow-hidden rounded-card border border-line bg-white p-6 text-left shadow-card transition-transform hover:-translate-y-1 sm:p-8 lg:col-span-2"><div className="flex items-start justify-between gap-4"><div className="flex h-11 w-11 shrink-0 items-center justify-center rounded-item bg-sky-light text-sky"><Icon name="MessageCircleMore" className="h-5 w-5" /></div><Icon name="ArrowUpRight" className="h-6 w-6 text-ink-faint transition-transform group-hover:translate-x-0.5 group-hover:-translate-y-0.5" /></div><p className="mt-6 text-sm font-semibold uppercase tracking-wide text-sky">{c.hero.aiLabel}</p><p className="mt-1 font-display text-xl font-bold leading-snug text-ink sm:text-2xl">{c.hero.aiText}</p><span className="mt-5 inline-flex items-center gap-2 rounded-item border border-line px-4 py-2.5 text-sm font-semibold text-trust">{c.hero.aiButton}<Icon name="ArrowRight" className="h-4 w-4" /></span></button></div></section>

          <section id="situacije" className="mx-auto max-w-6xl px-4 pt-16 sm:px-6 sm:pt-24"><h2 className="font-display text-2xl font-extrabold tracking-tight text-ink sm:text-3xl">{c.problems.title}</h2><div className="mt-6 grid grid-cols-1 gap-3 sm:mt-8 sm:grid-cols-2 lg:grid-cols-3">{problems.map(problem => { const item = problem[lang]; const isOpen = expanded === problem.id; const cardExperts = item.expertIds.map(expertById).filter(Boolean); return <article key={problem.id} className={cx('rounded-item border border-line bg-white shadow-card transition-all', isOpen ? 'ring-2 ring-trust/10 sm:col-span-2 lg:col-span-2' : 'hover:border-trust/40 hover:shadow-trust-sm')} style={{ borderLeftWidth: '3px', borderLeftColor: problem.accent }}><button type="button" onClick={() => setExpanded(isOpen ? null : problem.id)} className="group flex w-full items-start gap-3.5 p-4 text-left"><div className="flex h-9 w-9 shrink-0 items-center justify-center rounded-[8px]" style={{ backgroundColor: problem.accent + '14', color: problem.accent }}><Icon name={problem.icon} className="h-[17px] w-[17px]" /></div><div className="min-w-0 flex-1"><p className="text-sm font-semibold leading-snug text-ink">{item.title}</p><p className="mt-0.5 text-xs leading-snug text-ink-faint">{item.desc}</p></div><Icon name={isOpen ? 'ChevronUp' : 'ChevronDown'} className="mt-1 h-4 w-4 shrink-0 text-ink-faint" /></button>{isOpen && <div className="border-t border-line px-4 pb-4 pt-4 sm:ml-16 sm:pl-0"><div className="rounded-item bg-paper p-3.5"><p className="flex items-center gap-2 text-xs font-bold uppercase tracking-wide text-trust"><Icon name="Lightbulb" className="h-4 w-4" />{c.problems.quickInfo}</p><p className="mt-2 text-sm leading-6 text-ink-soft">{item.info}</p></div><p className="mt-3 text-sm font-medium leading-6 text-ink">{item.action}</p><p className="mt-4 text-xs font-semibold uppercase tracking-wide text-ink-faint">{c.problems.experts}</p><div className="mt-2 flex flex-wrap gap-2">{cardExperts.map(expert => <button key={expert.id} type="button" onClick={() => openModal(problem.id, expert.id)} className="inline-flex items-center gap-2 rounded-full border border-line bg-white px-3 py-2 text-xs font-semibold text-ink-soft hover:border-trust hover:text-trust"><span className="grid h-6 w-6 place-items-center rounded-full text-[10px] font-bold" style={{ backgroundColor: expert.bg, color: expert.color }}>{expert.initials}</span>{expert.name}<Icon name="BadgeCheck" className="h-3.5 w-3.5 text-trust" /></button>)}</div><div className="mt-4 flex flex-col gap-3 sm:flex-row sm:items-center"><button type="button" onClick={() => openModal(problem.id)} className="inline-flex min-h-11 items-center justify-center gap-2 rounded-item bg-trust px-4 py-2.5 text-sm font-semibold text-white hover:bg-trust-dark"><Icon name="MessageCircle" className="h-4 w-4" />{c.problems.action}</button><span className="text-xs leading-5 text-ink-faint">{c.problems.note}</span></div></div>}</article>; })}</div><div className="mt-6 flex justify-start"><button type="button" onClick={() => openModal()} className="text-sm font-semibold text-trust underline decoration-trust/30 underline-offset-4 hover:decoration-trust">{c.problems.cta}</button></div></section>

          <section id="strucnjaci" className="mx-auto max-w-6xl px-4 pt-16 sm:px-6 sm:pt-24"><h2 className="font-display text-2xl font-extrabold tracking-tight text-ink sm:text-3xl">{c.experts.title}</h2><div className="mt-6 grid grid-cols-1 gap-4 sm:mt-8 sm:grid-cols-3">{experts.map(expert => { const item = expert[lang]; return <article key={expert.id} className="flex flex-col rounded-card border border-line bg-white p-5 shadow-card"><div className="flex items-center gap-3"><div className="flex h-12 w-12 items-center justify-center rounded-full font-display text-base font-bold" style={{ backgroundColor: expert.bg, color: expert.color }}>{expert.initials}</div><div><p className="font-display text-base font-bold text-ink">{expert.name}</p><p className="text-xs text-ink-faint">{item.spec}</p></div></div><div className="mt-4 inline-flex w-fit items-center gap-1.5 rounded-full bg-sky-light px-2.5 py-1 text-xs font-semibold text-sky"><Icon name="BadgeCheck" className="h-[13px] w-[13px]" />{c.experts.badge}</div><p className="mt-3 text-sm leading-6 text-ink-soft">{item.bio}</p><button type="button" onClick={() => openModal('', expert.id)} className="mt-5 rounded-item border border-line py-2.5 text-sm font-semibold text-trust transition-colors hover:border-trust hover:bg-trust-light">{c.experts.button} {expert.name}</button></article>; })}</div></section>
        </main>

        <footer className="mt-20 border-t border-line bg-white"><div className="mx-auto max-w-6xl px-4 py-10 sm:px-6"><div className="flex items-center gap-2"><div className="flex h-7 w-7 items-center justify-center rounded-[7px] bg-trust text-white"><Icon name="ShieldCheck" className="h-3.5 w-3.5" /></div><span className="font-display text-sm font-extrabold text-ink">{c.brand}</span></div><p className="mt-4 max-w-3xl text-xs leading-relaxed text-ink-faint">{c.footer.legal}</p><p className="mt-6 text-xs text-ink-faint">© 2026 {c.brand}</p></div></footer>

        {chatOpen && <div className="fixed inset-x-3 bottom-3 z-50 flex h-[min(560px,80vh)] flex-col overflow-hidden rounded-card border border-line bg-white shadow-trust sm:inset-auto sm:bottom-6 sm:right-6 sm:w-[380px]" role="dialog" aria-label={c.chat.title}><div className="flex items-center justify-between bg-trust px-4 py-3.5"><div className="flex items-center gap-2.5"><div className="flex h-8 w-8 items-center justify-center rounded-full bg-white/15 text-white"><Icon name="Bot" className="h-4 w-4" /></div><div><span className="font-display text-sm font-bold text-white">{c.chat.title}</span><p className="text-[11px] text-white/70">{c.chat.status}</p></div></div><button type="button" onClick={() => setChatOpen(false)} aria-label={c.chat.close} className="flex h-7 w-7 items-center justify-center rounded-full text-white/80 hover:bg-white/10 hover:text-white"><Icon name="X" className="h-4 w-4" /></button></div><div className="no-scrollbar flex-1 space-y-3 overflow-y-auto bg-paper px-4 py-4"><div className="ml-auto max-w-[85%] rounded-2xl rounded-tr-sm bg-trust px-3.5 py-2.5 text-sm leading-6 text-white">{chatAsked ? chatQuestion : c.chat.userMsg}</div><div className="mr-auto max-w-[85%] rounded-2xl rounded-tl-sm border border-line bg-white px-3.5 py-2.5 text-sm leading-6 text-ink"><div className="mb-2 text-[10px] font-bold uppercase tracking-wide text-trust">{chatState === 'loading' ? c.chat.thinking : (chatMode === 'openai' ? c.chat.liveLabel : c.chat.demoLabel)}</div>{chatState === 'loading' ? <span className="inline-flex items-center gap-1"><span className="h-1.5 w-1.5 animate-bounce rounded-full bg-trust/60" /><span className="h-1.5 w-1.5 animate-bounce rounded-full bg-trust/60 [animation-delay:120ms]" /><span className="h-1.5 w-1.5 animate-bounce rounded-full bg-trust/60 [animation-delay:240ms]" /></span> : (chatAnswer || c.chat.aiMsg)}<button type="button" onClick={() => openModal()} className="mt-3 block w-full rounded-item bg-amber px-3 py-2 text-center text-xs font-semibold text-white transition-colors hover:bg-amber-dark">{c.chat.aiButton}</button></div><p className="text-center text-[11px] leading-5 text-ink-faint">{c.chat.disclaimer}</p></div><form onSubmit={event => { event.preventDefault(); askChat(chatDraft); }} className="flex items-center gap-2 border-t border-line p-3"><input type="text" value={chatDraft} onChange={event => setChatDraft(event.target.value)} placeholder={c.chat.inputPlaceholder} aria-label={c.chat.inputPlaceholder} className="min-w-0 flex-1 rounded-item border border-line bg-paper px-3 py-2.5 text-sm text-ink placeholder:text-ink-faint focus:border-trust focus:outline-none" /><button type="submit" aria-label={c.chat.send} className="flex h-10 w-10 shrink-0 items-center justify-center rounded-item bg-trust text-white transition-colors hover:bg-trust-dark"><Icon name="Send" className="h-4 w-4" /></button></form></div>}
        {!chatOpen && <button type="button" onClick={() => setChatOpen(true)} aria-label={c.chat.title} className="fixed bottom-5 right-5 z-40 flex h-14 w-14 items-center justify-center rounded-full bg-trust text-white shadow-trust transition-transform hover:-translate-y-1 sm:bottom-6 sm:right-6"><Icon name="MessageCircleMore" className="h-6 w-6" /></button>}

        {modalOpen && <Modal titleId="intake-title" onClose={closeModal}><div className="safe-bottom"><div className="flex items-center justify-between border-b border-line px-5 py-4"><h2 id="intake-title" className="font-display text-lg font-bold text-ink">{c.form.title}</h2><button type="button" onClick={closeModal} aria-label={c.form.close} className="flex h-8 w-8 items-center justify-center rounded-full text-ink-faint hover:bg-paper hover:text-ink"><Icon name="X" className="h-[18px] w-[18px]" /></button></div>{submission.state === 'success' ? <div className="flex flex-col items-center px-6 py-12 text-center"><div className="flex h-14 w-14 items-center justify-center rounded-full bg-trust-light text-trust"><Icon name="FileCheck2" className="h-7 w-7" /></div><p className="mt-4 font-display text-lg font-bold text-ink">{lang === 'ro' ? 'Trimis cu succes' : 'Uspješno poslano'}</p><p className="mt-1.5 text-sm text-ink-soft">{c.form.success}</p></div> : <form onSubmit={submitDocument} className="px-5 py-5"><label className="block text-sm"><span className="mb-1.5 block font-medium text-ink">{c.form.name}</span><input type="text" value={form.name} onChange={event => updateField('name', event.target.value)} className="w-full rounded-item border border-line bg-paper px-3.5 py-2.5 text-sm text-ink focus:border-trust focus:outline-none" /></label><label className="mt-4 block text-sm"><span className="mb-1.5 block font-medium text-ink">{c.form.email} <span className="text-red-500">*</span></span><input required type="email" value={form.email} onChange={event => updateField('email', event.target.value)} className="w-full rounded-item border border-line bg-paper px-3.5 py-2.5 text-sm text-ink focus:border-trust focus:outline-none" placeholder="vi@email.com" /></label><label className="mt-4 block text-sm"><span className="mb-1.5 block font-medium text-ink">{c.form.contact} <span className="text-red-500">*</span></span><span className="mb-1.5 block text-xs text-ink-faint">{c.form.contactHint}</span><input required type="tel" value={form.phone} onChange={event => updateField('phone', event.target.value)} placeholder="+420 / +40" className="w-full rounded-item border border-line bg-paper px-3.5 py-2.5 text-sm text-ink placeholder:text-ink-faint focus:border-trust focus:outline-none" /></label><label className="mt-4 block text-sm"><span className="mb-1.5 block font-medium text-ink">{c.form.problemType}</span><select value={form.problem} onChange={event => updateField('problem', event.target.value)} className="w-full rounded-item border border-line bg-paper px-3.5 py-2.5 text-sm text-ink focus:border-trust focus:outline-none"><option value="">{c.form.problemPlaceholder}</option>{problems.map(problem => <option key={problem.id} value={problem.id}>{problem[lang].title}</option>)}<option value="other">{lang === 'ro' ? 'Altă situație' : 'Druga situacija'}</option></select></label><label className="mt-4 block text-sm"><span className="mb-1.5 block font-medium text-ink">{c.form.description}</span><textarea rows="3" value={form.description} onChange={event => updateField('description', event.target.value)} placeholder={c.form.descriptionPlaceholder} className="w-full resize-none rounded-item border border-line bg-paper px-3.5 py-2.5 text-sm text-ink placeholder:text-ink-faint focus:border-trust focus:outline-none" /></label><div className="mt-4 text-sm"><span className="mb-1.5 block font-medium text-ink">{c.form.upload} <span className="text-red-500">*</span></span><input ref={input} type="file" className="hidden" accept=".pdf,.jpg,.jpeg,.png" capture="environment" onChange={event => pick(event.target.files)} /><div onDragOver={event => { event.preventDefault(); setDragActive(true); }} onDragLeave={() => setDragActive(false)} onDrop={event => { event.preventDefault(); setDragActive(false); pick(event.dataTransfer.files); }} onClick={() => input.current?.click()} className={cx('flex cursor-pointer flex-col items-center justify-center rounded-item border-2 border-dashed px-4 py-7 text-center transition-colors', dragActive ? 'border-trust bg-trust-light' : 'border-line bg-paper hover:border-trust/40')}><Icon name="UploadCloud" className={cx('h-[22px] w-[22px]', dragActive ? 'text-trust' : 'text-ink-faint')} /><p className="mt-2 text-xs text-ink-faint">{file ? <span className="font-semibold text-trust">{file.name}</span> : c.form.uploadHint}</p><span className="mt-3 rounded-item border border-line bg-white px-3 py-2 text-xs font-semibold text-trust">{file ? c.form.changeFile : c.form.chooseFile}</span></div></div><label className="mt-4 flex items-start gap-2.5 rounded-item bg-paper p-3 text-xs leading-5 text-ink-soft"><input type="checkbox" checked={form.consent} onChange={event => updateField('consent', event.target.checked)} className="mt-0.5 h-4 w-4 shrink-0 accent-[#1B4F91]" />{c.form.consent}</label><button type="submit" disabled={submission.state === 'loading'} className="mt-5 w-full rounded-item bg-trust py-3 text-sm font-semibold text-white shadow-trust-sm transition-colors hover:bg-trust-dark disabled:cursor-wait disabled:opacity-60">{submission.state === 'loading' ? c.form.sending : c.form.submit}</button><p className="mt-3 flex items-start gap-1.5 text-xs leading-snug text-ink-faint"><Icon name="ShieldCheck" className="mt-0.5 h-3.5 w-3.5 shrink-0 text-trust" />{c.form.trust} {c.form.security}</p>{submission.message && <div role="status" className={cx('mt-4 rounded-item border px-3 py-2.5 text-xs leading-5', submission.state === 'error' ? 'border-red-200 bg-red-50 text-red-800' : 'border-trust/20 bg-trust-light text-trust-dark')}>{submission.message}</div>}</form>}</div></Modal>}
      </div>;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
