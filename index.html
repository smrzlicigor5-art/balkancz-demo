    }

    function PortalHero({ page, c, view, onClick }) {
      return <section className="portal-glow portal-grid relative overflow-hidden bg-trust-deep text-white"><div className="mx-auto max-w-[1280px] px-4 py-16 sm:px-6 sm:py-24 lg:px-8"><div className="max-w-3xl"><p className="text-xs font-bold uppercase tracking-[.18em] text-coral">{page.eyebrow}</p><h1 className="mt-5 font-display text-4xl font-extrabold leading-[1.06] tracking-tight sm:text-6xl">{page.title}</h1><p className="mt-5 max-w-2xl text-base leading-7 text-white/65 sm:text-lg">{page.subtitle}</p>{view === 'listings' && <button type="button" onClick={onClick} className="mt-8 inline-flex min-h-11 items-center gap-2 rounded-item bg-coral px-5 py-3 text-sm font-semibold text-white shadow-coral">{c.portal.listing} <Icon name="Plus" className="h-4 w-4" /></button>}</div></div></section>;
    }

    function TermsPage({ c, lang, navigate, openModal }) {
      const t = c.terms;
      return <main>
        <section className="portal-glow portal-grid relative overflow-hidden bg-trust-deep text-white"><div className="mx-auto max-w-[1280px] px-4 py-16 sm:px-6 sm:py-24 lg:px-8"><div className="max-w-3xl"><p className="text-xs font-bold uppercase tracking-[.18em] text-coral">{t.eyebrow}</p><h1 className="mt-5 font-display text-4xl font-extrabold leading-[1.06] tracking-tight sm:text-6xl">{t.title}</h1><p className="mt-5 max-w-2xl text-base leading-7 text-white/65 sm:text-lg">{t.subtitle}</p><p className="mt-5 text-xs font-semibold uppercase tracking-[.14em] text-white/45">{t.updated}</p></div></div></section>
        <section className="mx-auto max-w-[1280px] px-4 py-12 sm:px-6 sm:py-16 lg:px-8"><div className="grid gap-5 lg:grid-cols-[1.12fr_.88fr] lg:items-start"><div className="rounded-card border border-line bg-white p-5 shadow-card sm:p-8">{t.sections.map(section => <article key={section.title} className="border-b border-line py-5 first:pt-0 last:border-b-0 last:pb-0"><h2 className="font-display text-lg font-bold text-ink">{section.title}</h2><p className="mt-2 text-sm leading-7 text-ink-soft">{section.text}</p></article>)}</div><aside className="space-y-5 lg:sticky lg:top-24"><div className="rounded-card border border-coral/30 bg-coral-light p-5"><div className="flex items-start gap-3"><span className="flex h-9 w-9 shrink-0 items-center justify-center rounded-[8px] bg-white text-coral"><Icon name="ShieldAlert" className="h-[18px] w-[18px]" /></span><p className="text-sm font-semibold leading-6 text-ink">{t.disclaimer}</p></div></div><div className="rounded-card border border-line bg-white p-5 shadow-card"><h2 className="font-display text-lg font-bold text-ink">{t.sourcesTitle}</h2><p className="mt-2 text-sm leading-6 text-ink-soft">{t.sourcesNote}</p><div className="mt-5 grid gap-2.5">{legalSources.map(source => { const item = source[lang]; return <a key={source.url} href={source.url} target="_blank" rel="noreferrer" className="group flex items-start gap-3 rounded-item border border-line bg-paper p-3 transition-colors hover:border-trust/30 hover:bg-trust-light"><span className="mt-0.5 flex h-8 w-8 shrink-0 items-center justify-center rounded-[7px] bg-white text-trust"><Icon name={source.icon} className="h-4 w-4" /></span><span className="min-w-0"><span className="block text-sm font-semibold text-ink group-hover:text-trust">{item.title}</span><span className="mt-0.5 block text-xs leading-5 text-ink-faint">{item.detail}</span></span><Icon name="ExternalLink" className="mt-1 h-3.5 w-3.5 shrink-0 text-ink-faint" /></a>; })}</div></div></aside></div><div className="mt-7 flex flex-col gap-3 sm:flex-row sm:items-center"><button type="button" onClick={() => navigate('home')} className="inline-flex min-h-11 items-center justify-center gap-2 rounded-item border border-line bg-white px-4 py-2.5 text-sm font-semibold text-ink-soft hover:border-trust hover:text-trust"><Icon name="ArrowLeft" className="h-4 w-4" />{t.back}</button><button type="button" onClick={() => openModal()} className="inline-flex min-h-11 items-center justify-center gap-2 rounded-item bg-coral px-4 py-2.5 text-sm font-semibold text-white shadow-coral">{t.action}<Icon name="ArrowRight" className="h-4 w-4" /></button></div></section>
      </main>;
    }

    function CtaBanner({ c, onClick }) {
      return <section className="mt-20 bg-trust py-12 text-white sm:mt-28"><div className="mx-auto flex max-w-[1280px] flex-col gap-7 px-4 sm:flex-row sm:items-center sm:justify-between sm:px-6 lg:px-8"><div><p className="text-xs font-bold uppercase tracking-[.18em] text-coral">{c.triage.eyebrow}</p><h2 className="mt-3 font-display text-2xl font-extrabold sm:text-3xl">{c.triage.title}</h2><p className="mt-2 max-w-xl text-sm leading-6 text-white/65">{c.triage.text}</p></div><button type="button" onClick={onClick} className="inline-flex min-h-11 shrink-0 items-center justify-center gap-2 rounded-item bg-coral px-5 py-3 text-sm font-semibold text-white shadow-coral">{c.triage.button} <Icon name="ArrowRight" className="h-4 w-4" /></button></div></section>;
    }

    function UpdatesPreview({ c, lang, onOpen, onGuide }) {
      return <section className="mx-auto max-w-[1280px] px-4 py-16 sm:px-6 sm:py-24 lg:px-8"><div className="flex flex-col gap-3 sm:flex-row sm:items-end sm:justify-between"><div><p className="text-xs font-bold uppercase tracking-[.18em] text-coral">{c.updates.eyebrow}</p><h2 className="mt-3 font-display text-3xl font-extrabold tracking-tight text-ink sm:text-4xl">{c.updates.title}</h2><p className="mt-3 max-w-2xl text-sm leading-6 text-ink-soft">{c.updates.text}</p></div><button type="button" onClick={onOpen} className="inline-flex items-center gap-2 text-sm font-semibold text-trust">{c.updates.button} <Icon name="ArrowRight" className="h-4 w-4" /></button></div><div className="mt-8 grid gap-4 lg:grid-cols-3">{portalCards.updates.slice(0, 3).map(card => <article key={card.id} className="rounded-item border border-line bg-white p-5 shadow-card"><div className="flex items-center justify-between"><span className="text-[10px] font-bold uppercase tracking-wide text-trust">{card[lang].tag}</span><span className="rounded-full bg-trust-light px-2.5 py-1 text-[10px] font-semibold text-trust">{card[lang].badge}</span></div><h3 className="mt-5 font-display text-lg font-bold text-ink">{card[lang].title}</h3><p className="mt-2 text-sm leading-6 text-ink-faint">{card[lang].desc}</p><button type="button" onClick={() => onGuide(card)} className="mt-5 inline-flex items-center gap-2 text-sm font-semibold text-trust">{c.portal.open} <Icon name="ArrowRight" className="h-4 w-4" /></button></article>)}</div><p className="mt-5 text-xs text-ink-faint">{c.updates.verified}</p></section>;
    }

    function ExpertsSection({ c, lang, openModal }) {
      return <section className="mx-auto max-w-[1280px] px-4 pb-16 sm:px-6 sm:pb-24 lg:px-8"><div className="flex flex-col gap-3 sm:flex-row sm:items-end sm:justify-between"><div><p className="text-xs font-bold uppercase tracking-[.18em] text-coral">{lang === 'ro' ? 'AJUTOR UMAN' : 'LJUDSKA POMOĆ'}</p><h2 className="mt-3 font-display text-3xl font-extrabold tracking-tight text-ink sm:text-4xl">{c.experts.title}</h2></div><button type="button" onClick={() => openModal()} className="text-sm font-semibold text-trust underline underline-offset-4">{c.problems.cta}</button></div><div className="mt-8 grid grid-cols-1 gap-4 sm:grid-cols-3">{experts.map(expert => { const item = expert[lang]; return <article key={expert.id} className="flex flex-col rounded-card border border-line bg-white p-5 shadow-card"><div className="flex items-center gap-3"><div className="flex h-12 w-12 items-center justify-center rounded-full font-display text-base font-bold" style={{ backgroundColor: expert.bg, color: expert.color }}>{expert.initials}</div><div><p className="font-display text-base font-bold text-ink">{expert.name}</p><p className="text-xs text-ink-faint">{item.spec}</p></div></div><div className="mt-4 inline-flex w-fit items-center gap-1.5 rounded-full bg-sky-light px-2.5 py-1 text-xs font-semibold text-sky"><Icon name="BadgeCheck" className="h-[13px] w-[13px]" />{c.experts.badge}</div><p className="mt-3 text-sm leading-6 text-ink-soft">{item.bio}</p><button type="button" onClick={() => openModal('', expert.id)} className="mt-5 rounded-item border border-line py-2.5 text-sm font-semibold text-trust transition-colors hover:border-trust hover:bg-trust-light">{c.experts.button} {expert.name}</button></article>; })}</div></section>;
    }

    function Footer({ c, navigate }) {
      return <footer className="border-t border-white/10 bg-trust-deep text-white"><div className="mx-auto max-w-[1280px] px-4 py-12 sm:px-6 lg:px-8"><div className="grid gap-10 sm:grid-cols-[1.4fr_1fr_1fr]"><div><button type="button" onClick={() => navigate('home')} className="font-display text-lg font-extrabold">Balkan<span className="text-coral">CZ</span><i className="ml-0.5 inline-block h-1.5 w-1.5 -translate-y-1 rounded-full bg-sky" /></button><p className="mt-4 max-w-sm text-sm leading-6 text-white/55">{c.footer.description}</p></div><div><p className="text-xs font-bold uppercase tracking-[.16em] text-coral">{c.nav.guides}</p><div className="mt-4 grid gap-3 text-sm text-white/55">{[['jobs', c.nav.jobs], ['documents', c.nav.documents], ['taxes', c.nav.taxes]].map(([key, label]) => <button key={key} type="button" onClick={() => navigate(key)} className="text-left transition-colors hover:text-white">{label}</button>)}</div></div><div><p className="text-xs font-bold uppercase tracking-[.16em] text-coral">{c.footer.about}</p><div className="mt-4 grid gap-3 text-sm text-white/55"><button type="button" className="text-left hover:text-white">{c.footer.contact}</button><button type="button" onClick={() => navigate('terms')} className="text-left hover:text-white">{c.footer.privacy}</button><button type="button" onClick={() => navigate('terms')} className="text-left hover:text-white">{c.footer.terms}</button></div></div></div><div className="mt-10 flex flex-col gap-3 border-t border-white/10 pt-5 text-xs text-white/40 sm:flex-row sm:items-center sm:justify-between"><span>© 2026 {c.brand}</span><span>{c.footer.legal}</span></div></div></footer>;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
