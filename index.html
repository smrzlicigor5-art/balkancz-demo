<!doctype html>
<html lang="hr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BalkanCZ — Problem First</title>
  <meta name="description" content="Problem-first administrativna pomoć za Ex-Yu dijasporu u Češkoj." />
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config={theme:{extend:{colors:{trust:{50:'#f4f8ff',100:'#e7f0ff',200:'#ccdefe',300:'#a9c7fb',500:'#4f87eb',600:'#3169d5',700:'#2855ad',900:'#243e73'}},boxShadow:{soft:'0 10px 30px rgba(15,23,42,.07)',upload:'0 26px 70px rgba(49,105,213,.18)'}}}};
  </script>
  <style>
    body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .scrollbar-hide::-webkit-scrollbar{display:none}.scrollbar-hide{scrollbar-width:none}
  </style>
</head>
<body class="bg-slate-50 text-slate-900">
<div id="root"></div>
<script type="text/babel">
const {useState,useRef,useEffect}=React;
function Icon({name,className='w-5 h-5'}){const r=useRef(null);useEffect(()=>{if(r.current&&window.lucide?.icons?.[name]){r.current.innerHTML='';r.current.appendChild(window.lucide.createElement(window.lucide.icons[name],{class:className}))}},[name,className]);return <span ref={r}/>}
const problems=[
['Dobio/la sam pismo od úřada','MailWarning','amber'],['Rodilo mi se dijete','Baby','blue'],['Problem sa stanodavcem / Kaucija','KeyRound','red'],['Dug za zdravstveno (VZP)','HeartPulse','red'],['Otvaram/Zatvaram OSVČ (Paušal)','BriefcaseBusiness','blue'],['Selim se u Češku / Odlazim','Plane','blue']];
const packs=[
['Analiza službenog pisma (Datová schránka)','15 €','FileSearch'],['Dopis za povrat kaucije za stan','25 €','House'],['Godišnji pregled OSVČ (Pohoda)','80 €','Calculator'],['Priprema papira za dječji doplatak','50 €','Baby']];
function Modal({children,onClose}){useEffect(()=>{const f=e=>e.key==='Escape'&&onClose();window.addEventListener('keydown',f);return()=>window.removeEventListener('keydown',f)},[onClose]);return <div className="fixed inset-0 z-50 flex items-end justify-center bg-slate-950/45 backdrop-blur-[2px] sm:items-center sm:p-4" onMouseDown={e=>e.target===e.currentTarget&&onClose()}><div role="dialog" aria-modal="true" className="max-h-[92vh] w-full overflow-auto rounded-t-3xl bg-white shadow-2xl sm:max-w-2xl sm:rounded-3xl">{children}</div></div>}
function App(){
 const[file,setFile]=useState(''),[drag,setDrag]=useState(false),[modal,setModal]=useState(null),[selected,setSelected]=useState(''),[toast,setToast]=useState('');const inp=useRef(null);
 const notify=t=>{setToast(t);setTimeout(()=>setToast(''),2400)};const pick=f=>{if(f?.[0]){setFile(f[0].name);notify('Dokument je spreman za demo procjenu — ništa još nije poslano.')}};
 const openProblem=t=>{setSelected(t);setModal(t==='Rodilo mi se dijete'?'baby':'generic')};
 return <div className="min-h-screen">
 <header className="sticky top-0 z-30 border-b border-slate-200 bg-white/95 backdrop-blur"><div className="mx-auto flex h-16 max-w-7xl items-center justify-between px-4 sm:px-6 lg:px-8"><div className="flex items-center gap-3"><div className="grid h-9 w-9 place-items-center rounded-xl bg-trust-600 font-bold text-white">B</div><div><div className="font-bold">BalkanCZ</div><div className="text-[11px] text-slate-500">Problem-first pomoć u Češkoj</div></div></div><nav className="hidden gap-6 text-sm font-medium text-slate-600 md:flex"><a href="#problemi" className="hover:text-trust-700">Problemi</a><a href="#kako" className="hover:text-trust-700">Kako radi</a><a href="#paketi" className="hover:text-trust-700">Gotova rješenja</a></nav><button onClick={()=>document.getElementById('upload-box')?.scrollIntoView({behavior:'smooth'})} className="rounded-xl bg-trust-600 px-4 py-2.5 text-sm font-semibold text-white hover:bg-trust-700 focus:ring-4 focus:ring-trust-100">Pošalji dokument</button></div></header>
 <main>
  <section className="relative overflow-hidden border-b border-slate-200 bg-white"><div className="absolute inset-0 bg-[radial-gradient(circle_at_80%_10%,rgba(49,105,213,.11),transparent_30%),radial-gradient(circle_at_10%_70%,rgba(245,158,11,.07),transparent_26%)]"></div><div className="relative mx-auto max-w-7xl px-4 py-16 sm:px-6 sm:py-20 lg:px-8 lg:py-24"><div className="mx-auto max-w-4xl text-center"><div className="mx-auto mb-5 inline-flex items-center gap-2 rounded-full border border-trust-200 bg-trust-50 px-3 py-1.5 text-sm font-semibold text-trust-700"><Icon name="ShieldCheck" className="w-4 h-4"/>Administrativna pomoć na našem jeziku</div><h1 className="text-4xl font-extrabold tracking-tight text-slate-950 sm:text-5xl lg:text-6xl">Riješite problem u Češkoj. Brzo, legalno i na našem jeziku.</h1><p className="mx-auto mt-5 max-w-3xl text-lg leading-8 text-slate-600">Ne znate odakle početi? Odaberite što vam se dogodilo ili nam pošaljite dokument.</p></div>
  <div id="upload-box" className="mx-auto mt-10 max-w-4xl"><div onDragOver={e=>{e.preventDefault();setDrag(true)}} onDragLeave={()=>setDrag(false)} onDrop={e=>{e.preventDefault();setDrag(false);pick(e.dataTransfer.files)}} onClick={()=>inp.current?.click()} className={`group cursor-pointer rounded-3xl border-2 border-dashed p-7 text-center shadow-upload transition sm:p-10 ${drag?'border-trust-600 bg-trust-50':'border-trust-300 bg-gradient-to-b from-white to-trust-50 hover:border-trust-500'}`}><input ref={inp} type="file" className="hidden" accept=".pdf,.jpg,.jpeg,.png,.doc,.docx" onChange={e=>pick(e.target.files)}/><div className="mx-auto grid h-16 w-16 place-items-center rounded-2xl bg-trust-600 text-white shadow-lg transition group-hover:scale-105"><Icon name="FileUp" className="w-8 h-8"/></div><h2 className="mt-5 text-xl font-bold sm:text-2xl">Imate pismo ili opomenu koju ne razumijete?</h2><p className="mx-auto mt-2 max-w-2xl text-sm leading-6 text-slate-500">Povucite dokument ovdje ili kliknite za odabir. PDF, fotografija ili sken.</p><button className="mt-6 inline-flex items-center gap-2 rounded-xl bg-trust-600 px-5 py-3 font-semibold text-white hover:bg-trust-700 focus:ring-4 focus:ring-trust-100"><Icon name="Upload"/>Pošalji dokument na besplatnu procjenu</button>{file&&<div className="mx-auto mt-4 inline-flex items-center gap-2 rounded-lg border border-emerald-200 bg-emerald-50 px-3 py-2 text-sm font-medium text-emerald-700"><Icon name="CheckCircle2" className="w-4 h-4"/>{file}</div>}<p className="mt-4 text-xs text-slate-400">Demo prikaz — datoteka se trenutno ne šalje na server.</p></div></div></div></section>

  <section id="problemi" className="mx-auto max-w-7xl px-4 py-16 sm:px-6 lg:px-8"><div className="max-w-2xl"><p className="text-sm font-bold uppercase tracking-wider text-trust-600">Brzi početak</p><h2 className="mt-2 text-3xl font-bold tracking-tight">Što vam se dogodilo?</h2><p className="mt-3 text-slate-600">Ne morate znati koja institucija je nadležna. Krenite od životne situacije.</p></div><div className="mt-8 grid gap-4 sm:grid-cols-2 lg:grid-cols-3">{problems.map(([title,icon,tone])=><button key={title} onClick={()=>openProblem(title)} className="group flex min-h-40 flex-col items-start rounded-2xl border border-slate-200 bg-white p-5 text-left shadow-soft transition hover:-translate-y-0.5 hover:border-trust-300 focus:ring-4 focus:ring-trust-100"><div className={`grid h-11 w-11 place-items-center rounded-xl ${tone==='red'?'bg-red-50 text-red-600':tone==='amber'?'bg-amber-50 text-amber-600':'bg-trust-50 text-trust-600'}`}><Icon name={icon}/></div><div className="mt-5 flex w-full items-end justify-between gap-3"><span className="font-bold leading-6">{title}</span><Icon name="ArrowRight" className="w-5 h-5 text-slate-300 transition group-hover:translate-x-1 group-hover:text-trust-600"/></div></button>)}</div></section>

  <section id="kako" className="border-y border-slate-200 bg-white"><div className="mx-auto max-w-7xl px-4 py-16 sm:px-6 lg:px-8"><h2 className="text-3xl font-bold tracking-tight">Kako funkcionira BalkanCZ?</h2><div className="mt-8 grid gap-5 lg:grid-cols-3">{[
   ['1','Besplatni vodiči i rokovi - Saznajte svoja prava.','BookOpen','bg-emerald-50 text-emerald-700'],
   ['2','Fiksni paketi - Odaberite stručnjaka za konkretan problem (vize, prijevodi).','PackageCheck','bg-trust-50 text-trust-700'],
   ['3','Ključ u ruke - Vi pošaljete problem, mi ga riješimo umjesto vas.','Sparkles','bg-amber-50 text-amber-700']].map(([n,text,icon,tone])=><div key={n} className="rounded-2xl border border-slate-200 bg-slate-50 p-6"><div className="flex items-center justify-between"><div className={`grid h-11 w-11 place-items-center rounded-xl ${tone}`}><Icon name={icon}/></div><span className="text-sm font-extrabold text-slate-300">0{n}</span></div><p className="mt-5 text-lg font-semibold leading-7">{text}</p></div>)}</div></div></section>

  <section id="paketi" className="mx-auto max-w-7xl px-4 py-16 sm:px-6 lg:px-8"><div className="flex items-end justify-between gap-4"><div><p className="text-sm font-bold uppercase tracking-wider text-trust-600">Gotova rješenja</p><h2 className="mt-2 text-3xl font-bold tracking-tight">Najtraženija gotova rješenja</h2></div><span className="hidden text-sm text-slate-500 sm:block">Fiksne cijene · jasan opseg usluge</span></div><div className="scrollbar-hide mt-8 flex gap-4 overflow-x-auto pb-3 lg:grid lg:grid-cols-4 lg:overflow-visible">{packs.map(([title,price,icon])=><article key={title} className="min-w-[280px] rounded-2xl border border-slate-200 bg-white p-5 shadow-soft lg:min-w-0"><div className="grid h-11 w-11 place-items-center rounded-xl bg-trust-50 text-trust-700"><Icon name={icon}/></div><h3 className="mt-5 min-h-14 font-bold leading-6">{title}</h3><div className="mt-5 flex items-end justify-between gap-3"><div><div className="text-xs font-medium uppercase tracking-wide text-slate-400">Cijena</div><div className="mt-1 text-2xl font-extrabold">{price}</div></div><button onClick={()=>notify(`Demo narudžba: ${title}`)} className="rounded-xl bg-trust-600 px-4 py-2.5 text-sm font-semibold text-white hover:bg-trust-700 focus:ring-4 focus:ring-trust-100">Naruči</button></div></article>)}</div></section>
 </main>
 <footer className="border-t border-slate-200 bg-slate-950 text-slate-300"><div className="mx-auto max-w-7xl px-4 py-10 sm:px-6 lg:px-8"><div className="flex flex-col gap-5 sm:flex-row sm:items-start sm:justify-between"><div><div className="font-bold text-white">BalkanCZ</div><p className="mt-2 max-w-xl text-sm leading-6 text-slate-400">BalkanCZ pruža administrativnu i prevoditeljsku pomoć. Nismo odvjetnički ured niti porezni savjetnici.</p></div><div className="text-xs text-slate-500">Demo UI · 2026</div></div></div></footer>

 {modal==='baby'&&<Modal onClose={()=>setModal(null)}><div className="p-6 sm:p-7"><div className="flex items-start justify-between gap-4"><div><span className="inline-flex rounded-full bg-trust-50 px-3 py-1 text-xs font-bold text-trust-700">TRIAGE REZULTAT</span><h3 className="mt-3 text-2xl font-extrabold">Rodilo se dijete - Što morate napraviti?</h3></div><button onClick={()=>setModal(null)} aria-label="Zatvori" className="rounded-lg p-2 text-slate-400 hover:bg-slate-100"><Icon name="X"/></button></div><div className="mt-7 space-y-0">{[['1','Prijava boravka (OAMP) - Rok: 60 dana','red'],['2','Zdravstveno osiguranje (VZP/pVZP) - Rok: 8 dana','amber'],['3','Rodni list i državljanstvo (Ambasada)','blue']].map(([n,text,tone],i)=><div key={n} className="relative flex gap-4 pb-6 last:pb-0">{i<2&&<div className="absolute left-5 top-10 h-[calc(100%-1rem)] w-px bg-slate-200"></div>}<div className={`z-10 grid h-10 w-10 shrink-0 place-items-center rounded-full font-bold ${tone==='red'?'bg-red-50 text-red-700':tone==='amber'?'bg-amber-50 text-amber-700':'bg-trust-50 text-trust-700'}`}>{n}</div><div className="pt-2 font-semibold">{text}</div></div>)}</div><div className="mt-8 rounded-2xl border border-trust-200 bg-trust-50 p-5"><h4 className="font-bold">Ne želite se baviti birokracijom?</h4><div className="mt-4 flex flex-col gap-3 sm:flex-row"><button onClick={()=>notify('Demo: traženje stručnjaka za obiteljske vize')} className="rounded-xl border border-trust-300 bg-white px-4 py-3 text-sm font-semibold text-trust-700 hover:bg-trust-50">Pronađi stručnjaka za obiteljske vize</button><button onClick={()=>notify("Demo paket: Sve za bebu (200€)")} className="rounded-xl bg-trust-600 px-4 py-3 text-sm font-semibold text-white hover:bg-trust-700">Kupi 'Sve za bebu' paket (200€)</button></div></div></div></Modal>}
 {modal==='generic'&&<Modal onClose={()=>setModal(null)}><div className="p-6 sm:p-7"><div className="flex items-start justify-between gap-4"><div><span className="inline-flex rounded-full bg-slate-100 px-3 py-1 text-xs font-bold text-slate-600">BRZA PROCJENA</span><h3 className="mt-3 text-2xl font-extrabold">{selected}</h3><p className="mt-2 text-sm leading-6 text-slate-500">U punoj verziji ovdje će se prikazati rokovi, nadležne institucije i preporučeni stručnjaci.</p></div><button onClick={()=>setModal(null)} className="rounded-lg p-2 text-slate-400 hover:bg-slate-100"><Icon name="X"/></button></div><button onClick={()=>{setModal(null);document.getElementById('upload-box')?.scrollIntoView({behavior:'smooth'})}} className="mt-6 w-full rounded-xl bg-trust-600 px-4 py-3 font-semibold text-white hover:bg-trust-700">Pošalji dokument za procjenu</button></div></Modal>}
 {toast&&<div className="fixed bottom-5 left-1/2 z-[70] -translate-x-1/2 rounded-xl bg-slate-950 px-4 py-3 text-sm font-medium text-white shadow-xl">{toast}</div>}
 </div>
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
